[package]
name = "weflow-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "weflow"
path = "src/main.rs"

[features]
# Counts the allocations of a run for the benchmark (#513); WEFLOW_ALLOC_STATS names the file they go to.
alloc-stats = []

[dependencies]
base64.workspace = true
async-stream.workspace = true
axum.workspace = true
clap.workspace = true
mimalloc.workspace = true
mime_guess.workspace = true
rand.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
# `serve` runs each request of the command API in a child process
tokio = { workspace = true, features = ["process", "io-util", "fs", "sync", "time"] }
# `serve` compresses its JSON answers (gzip / br, from `Accept-Encoding`)
tower-http = { workspace = true, features = ["compression-gzip", "compression-br"] }
tracing-subscriber.workspace = true
weflow-core = { path = "../weflow-core" }
weflow-assets = { path = "../weflow-assets" }

[dev-dependencies]
# the examples report their failures with it
anyhow.workspace = true
brotli-decompressor = "5"
flate2.workspace = true
# examples/dev_account.rs draws the pictures of the account `bun run dev` serves
jpeg-encoder.workspace = true
# the contract's tests (#400) check answers against web/contract/openapi.json; without the default features it
# reads no schema from the network or the disk
jsonschema = { version = "=0.60.0", default-features = false }
# tests/serve_api/ (media.rs, contract.rs) names Moments media the way the cache does
md-5.workspace = true
# tests/web_versions.rs publishes WebUI packages in a registry of its own
sha2.workspace = true
zip.workspace = true
weflow-native = { path = "../weflow-native", features = ["test-fixtures"] }
weflow-silk = { path = "../weflow-silk", features = ["test-encoder"] }

# turns on ANSI colours in the Windows console (`cache list` prints its header in green)
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
