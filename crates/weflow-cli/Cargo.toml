[package]
name = "weflow-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "weflow"
path = "src/main.rs"

[features]
# Counts the allocations of a run for the benchmark (#513); WEFLOW_ALLOC_STATS names the file they go to.
alloc-stats = []

[dependencies]
base64.workspace = true
async-stream.workspace = true
axum.workspace = true
# the human-readable output shows times in the local time zone (views/when.rs)
chrono.workspace = true
clap.workspace = true
mimalloc.workspace = true
mime_guess.workspace = true
rand.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
# the WebUI's Content-Security-Policy names the page's inline scripts by their hash (serve_api/ui.rs); tests/web_versions.rs
# publishes WebUI packages in a registry of its own
sha2.workspace = true
# `serve` runs each request of the command API in a child process
tokio = { workspace = true, features = ["process", "io-util", "fs", "sync", "time"] }
# `serve` compresses its JSON answers (gzip / br, from `Accept-Encoding`)
tower-http = { workspace = true, features = ["compression-gzip", "compression-br"] }
tracing-subscriber.workspace = true
# the human-readable output fits its lines to the terminal (views/layout.rs)
terminal_size.workspace = true
weflow-core = { path = "../weflow-core" }

[dev-dependencies]
# the examples report their failures with it
anyhow.workspace = true
brotli-decompressor = "5"
flate2.workspace = true
# examples/dev_account.rs draws the pictures of the account `bun run dev` serves with WEFLOW_DEV_ACCOUNT=dev
jpeg-encoder.workspace = true
# the contract's tests (#400) check answers against web/contract/openapi.json; without the default features it
# reads no schema from the network or the disk
jsonschema = { version = "=0.60.0", default-features = false }
# tests/serve_api/ (media.rs, contract.rs) names Moments media the way the cache does
md-5.workspace = true
zip.workspace = true
weflow-native = { path = "../weflow-native", features = ["test-fixtures"] }
# tests/serve_api/commands.rs runs `serve --insight` against it, so the engine writes an insight in the server
weflow-fake-model = { path = "../weflow-fake-model" }
weflow-silk = { path = "../weflow-silk", features = ["test-encoder"] }

# stop.rs reads whether SIGHUP is ignored (`nohup`) before listening for it
[target."cfg(unix)".dependencies]
libc = "0.2"

# launch.rs asks whether the console is this process's own, as a double-click in Explorer gives it
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
