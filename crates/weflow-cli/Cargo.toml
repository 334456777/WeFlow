[package]
name = "weflow-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "weflow"
path = "src/main.rs"

[dependencies]
base64.workspace = true
anyhow.workspace = true
async-stream.workspace = true
axum.workspace = true
clap.workspace = true
mimalloc.workspace = true
mime_guess.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
# `serve` runs each request of the command API in a child process
tokio = { workspace = true, features = ["process", "io-util", "fs", "sync", "time"] }
# `serve` compresses its JSON answers (gzip / br, from `Accept-Encoding`)
tower-http = { workspace = true, features = ["compression-gzip", "compression-br"] }
tracing.workspace = true
tracing-subscriber.workspace = true
weflow-core = { path = "../weflow-core" }
weflow-assets = { path = "../weflow-assets" }

[dev-dependencies]
brotli-decompressor = "5"
flate2.workspace = true
# tests/web_versions.rs publishes WebUI packages in a registry of its own
sha2.workspace = true
zip.workspace = true
weflow-native = { path = "../weflow-native", features = ["test-fixtures"] }
weflow-silk = { path = "../weflow-silk", features = ["test-encoder"] }

# turns on ANSI colours in the Windows console (`cache list` prints its header in green)
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
