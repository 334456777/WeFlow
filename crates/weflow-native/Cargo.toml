[package]
name = "weflow-native"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes.workspace = true
anyhow.workspace = true
cbc.workspace = true
hmac = "0.12"
libloading.workspace = true
md-5.workspace = true
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
regex.workspace = true
rusqlite = { version = "0.40", features = ["bundled", "serialize"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
zstd.workspace = true

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_System_Kernel", "Win32_System_SystemInformation", "Win32_System_Console"] }

[features]
# Expose the synthetic-account builder (src/fixture.rs) to other crates' tests.
test-fixtures = []

[[example]]
name = "refresh_probe"
required-features = ["test-fixtures"]
