[package]
name = "weflow-native"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
aes.workspace = true
anyhow.workspace = true
cbc.workspace = true
hmac = "0.13"
md-5.workspace = true
# `entities::decode_entities` 用它查找每个实体开头的 `&`
memchr.workspace = true
regex.workspace = true
rusqlite = { version = "0.40", features = ["bundled", "serialize"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
zstd.workspace = true
# 生成基准账号的语音（`test-fixtures`）
weflow-silk = { path = "../weflow-silk", features = ["test-encoder"], optional = true }
# `fixture::TestDir` 用它建目录（`test-fixtures`）
tempfile = { workspace = true, optional = true }

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_System_Kernel", "Win32_System_SystemInformation", "Win32_System_Console", "Win32_System_LibraryLoader"] }

# 所有架构的 Windows 都要：`cipher_vfs` 用文件句柄查询文件是否已被删除，`shared_file` 给每个读取的线程另开一个句柄
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

# `linux_key_helper` 附加到微信进程，读取它的寄存器和内存
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
libc = "0.2"

# `macos_key_helper` 用 `task_for_pid` 附加到微信进程，经 Mach 读取它的内存；
# 各个步骤记录为调试事件（`RUST_LOG=debug`）
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
mach2 = "0.5"
tracing.workspace = true

[dev-dependencies]
# 测试页密钥的派生（src/kdf.rs）时作参照
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
proptest.workspace = true
# 本 crate 自己的测试不开 `test-fixtures` 也编译 `fixture`，同样需要它
weflow-silk = { path = "../weflow-silk", features = ["test-encoder"] }
tempfile.workspace = true

[features]
# 让其他 crate 的测试也能用合成账号的生成器（src/fixture.rs）。
test-fixtures = ["dep:weflow-silk", "dep:tempfile"]

[[example]]
name = "refresh_probe"
required-features = ["test-fixtures"]

[[example]]
name = "cipher_bench"
required-features = ["test-fixtures"]
