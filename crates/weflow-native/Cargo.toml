[package]
name = "weflow-native"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
aes.workspace = true
anyhow.workspace = true
cbc.workspace = true
hmac = "0.13"
md-5.workspace = true
# the `&` of each entity in `entities::decode_entities`
memchr.workspace = true
regex.workspace = true
rusqlite = { version = "0.40", features = ["bundled", "serialize"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
zstd.workspace = true
# the voices of the benchmark account (`test-fixtures`)
weflow-silk = { path = "../weflow-silk", features = ["test-encoder"], optional = true }
# `fixture::TestDir` (`test-fixtures`)
tempfile = { workspace = true, optional = true }

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_System_Kernel", "Win32_System_SystemInformation", "Win32_System_Console", "Win32_System_LibraryLoader"] }

# `cipher_vfs` asks a file's handle whether the file was deleted, and `shared_file` reopens a handle for each reader, on
# every Windows
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

# `linux_key_helper` attaches to WeChat and reads its registers and memory
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
libc = "0.2"

# `macos_key_helper` attaches to WeChat with `task_for_pid` and reads its memory through Mach; its steps are debug
# events (`RUST_LOG=debug`)
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
mach2 = "0.5"
tracing.workspace = true

[dev-dependencies]
# the reference the derivation of the page keys (src/kdf.rs) is checked against
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
proptest.workspace = true
# the fixture is built for the crate's own tests too, without `test-fixtures`
weflow-silk = { path = "../weflow-silk", features = ["test-encoder"] }
tempfile.workspace = true

[features]
# Expose the synthetic-account builder (src/fixture.rs) to other crates' tests.
test-fixtures = ["dep:weflow-silk", "dep:tempfile"]

[[example]]
name = "refresh_probe"
required-features = ["test-fixtures"]

[[example]]
name = "cipher_bench"
required-features = ["test-fixtures"]
