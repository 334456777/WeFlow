[package]
name = "weflow-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
aes.workspace = true
aes-gcm.workspace = true
anyhow.workspace = true
base64.workspace = true
cbc.workspace = true
chrono.workspace = true
dirs.workspace = true
ecb.workspace = true
flate2.workspace = true
futures.workspace = true
heic-rs.workspace = true
rust_h265.workspace = true
indexmap.workspace = true
md-5.workspace = true
memchr.workspace = true
regex.workspace = true
regex-syntax.workspace = true
reqwest.workspace = true
rust_xlsxwriter.workspace = true
# the TLS provider of the HTTP clients (src/http_client.rs)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
# `time`: the pause before a model API request is tried again (src/model_api/retry.rs)
tokio = { workspace = true, features = ["time"] }
toml.workspace = true
sha1.workspace = true
terminal_size.workspace = true
rand.workspace = true
sha2.workspace = true
# `render::display_width`, the columns the human-readable output lines up on
unicode-width.workspace = true
walkdir.workspace = true
weflow-native = { path = "../weflow-native" }
weflow-silk = { path = "../weflow-silk" }
zip.workspace = true
icu_collator.workspace = true
icu_locale_core.workspace = true
jpeg-decoder = { version = "0.3", default-features = false }

# the effective user and the password database, for `sudo weflow` (#855)
[target."cfg(unix)".dependencies]
libc = "0.2"

# lists running processes (WeChat's pids) without starting `tasklist`, and reads their command lines (#101); turns on
# colours in the console (`colour`)
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Threading", "Wdk_System_Threading"] }

[dev-dependencies]
# tests/webui_e2e.rs serves WebUI packages from a registry of its own
axum.workspace = true
# the files src/jpeg.rs writes are compared with its own, and tests make JPEGs with it
jpeg-encoder.workspace = true
proptest.workspace = true
# the probes under examples/ read WeChat's compressed message text
zstd.workspace = true
weflow-native = { path = "../weflow-native", features = ["test-fixtures"] }
weflow-silk = { path = "../weflow-silk", features = ["test-encoder"] }
# the model API the insight tests ask (tests/model_api_e2e.rs, tests/insight_e2e.rs)
weflow-fake-model = { path = "../weflow-fake-model" }
# examples/search_probe.rs reads rows through `Account::with_db`
rusqlite = "0.40"
