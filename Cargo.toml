[workspace]
members = [
  "crates/weflow-assets",
  "crates/weflow-native",
  "crates/weflow-silk",
  "crates/weflow-core",
  "crates/weflow-cli",
  "crates/weflow-wcdb-ffi",
  "crates/weflow-wxkey",
]
resolver = "2"

[workspace.package]
version = "5.0.1"
edition = "2021"
license = "SEE LICENSE IN LICENSE"

[workspace.dependencies]
aes = "0.9"
aes-gcm = "0.11"
anyhow = "1.0.98"
async-stream = "0.3"
base64 = "0.23"
axum = "0.8.4"
cbc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5.40", features = ["derive", "env"] }
dirs = "7.0.0"
ecb = "0.2"
flate2 = "1"
futures = "0.3"
# HEVC still-picture decoder for WXGF images (pure Rust, no unsafe); the thread pool feature is not needed
heic-rs = { version = "0.1", default-features = false, features = ["std"] }
jpeg-encoder = "0.7"
icu_collator = "2.3"
icu_locale_core = "2.3"
libloading = "0.9"
md-5 = "0.11"
memchr = "2"
mimalloc = { version = "0.1", default-features = false }
mime_guess = "2.0.5"
regex = "1"
reqwest = { version = "0.13", features = ["json", "query", "rustls-no-provider", "gzip", "deflate", "brotli", "stream"], default-features = false }
rust_xlsxwriter = { version = "0.100", features = ["constant_memory"] }
# the JSON Schema of the command API's answers (#399), in /openapi.json
schemars = { version = "1.2.3", default-features = false, features = ["derive", "std"] }
serde = { version = "1.0.219", features = ["derive"] }
sha1 = "0.10"
terminal_size = "0.4"
rand = "0.10"
serde_json = { version = "1.0.140", features = ["preserve_order"] }
sha2 = "0.11.1"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tokio-stream = "0.1"
tower-http = { version = "0.7", default-features = false }
toml = "1.1"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
walkdir = "2.5.0"
zip = "2"
zstd = "0.14"

# Debug builds of the crypto/SQLite code are ~30x slower than release, which makes every database
# open take tens of seconds; keep the dependencies and the native database crate optimized.
[profile.dev.package."*"]
opt-level = 2
[profile.dev.package.weflow-native]
opt-level = 2

# Release builds: whole-program optimisation makes the single-file binary ~16% smaller and a few percent faster.
# Panics keep unwinding: the SQLite VFS and the C ABI catch them at the FFI boundary.
[profile.release]
lto = "thin"
codegen-units = 1
