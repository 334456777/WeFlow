[workspace]
members = [
  "crates/weflow-native",
  "crates/weflow-silk",
  "crates/weflow-core",
  "crates/weflow-cli",
  "crates/weflow-fake-model",
]
resolver = "2"

[workspace.package]
version = "7.0.0"
edition = "2021"
license = "Unlicense"

# Lints every member inherits (`[lints] workspace = true`); CI turns warnings into errors (issue #142).
[workspace.lints.rust]
# a type that borrows shows it, `Formatter<'_>` rather than `Formatter` (#1113)
elided_lifetimes_in_paths = "warn"
# every public type can be printed with `{:?}`; one that holds a key or a secret writes its `Debug` by hand and leaves
# them out (#1113)
missing_debug_implementations = "warn"
# every public item, and every crate root (tests, examples and build scripts too), has a doc comment (#915)
missing_docs = "warn"
# the proofs of `cargo kani` (#501)
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
# an `unsafe fn` says what its callers promise; each unsafe operation in it still has its own block and `SAFETY` (#1113)
unsafe_op_in_unsafe_fn = "warn"
# a path no longer than it needs to be, given what is in scope (#1113)
unused_qualifications = "warn"

[workspace.lints.clippy]
# a warning let through says why (#1113)
allow_attributes_without_reason = "warn"
cast_possible_truncation = "warn"
# left from debugging (#1113)
dbg_macro = "warn"
expect_used = "warn"
large_futures = "warn"
redundant_clone = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
# some of `pedantic`, each with few cases when it was turned on (#1113)
collapsible_else_if = "warn"
elidable_lifetime_names = "warn"
explicit_iter_loop = "warn"
filter_map_next = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
manual_let_else = "warn"
manual_string_new = "warn"
needless_continue = "warn"
needless_raw_string_hashes = "warn"
semicolon_if_nothing_returned = "warn"
single_char_pattern = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
# a widening that cannot lose anything is `From`, which a later change of type turns into an error rather than a
# silent truncation (#1113)
cast_lossless = "warn"
# a pointer to a place is `&raw const`/`&raw mut`, and a pointer cast says its target type with `cast`, not `as`,
# which also changes constness or casts to an integer without a word (#1113)
borrow_as_ptr = "warn"
ptr_as_ptr = "warn"
ref_as_ptr = "warn"

[workspace.dependencies]
aes = "0.9"
aes-gcm = "0.11"
anyhow = "1.0.98"
async-stream = "0.3"
base64 = "0.23"
axum = "0.8.4"
cbc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5.40", features = ["derive", "env"] }
dirs = "7.0.0"
ecb = "0.2"
flate2 = "1"
futures = "0.3"
# HEVC still-picture decoder for WXGF images (pure Rust, no unsafe); the thread pool feature is not needed
heic-rs = { version = "0.1", default-features = false, features = ["std"] }
# HEVC video decoder for the WXGF pictures heic-rs does not decode: the range-extension coding tools it lacks
rust_h265 = "0.4"
indexmap = { version = "2.14.2", features = ["serde"] }
jpeg-encoder = "0.7"
icu_collator = "2.3"
icu_locale_core = "2.3"
md-5 = "0.11"
# property tests (#502): without running each case in a process of its own or timing it out
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
memchr = "2"
mimalloc = { version = "0.1", default-features = false }
mime_guess = "2.0.5"
regex = "1"
# Unicode word characters for the regex `\b` in the XML scanners (src/xml.rs of weflow-core)
regex-syntax = "0.8"
reqwest = { version = "0.13", features = ["json", "query", "rustls-no-provider", "gzip", "deflate", "brotli", "stream"], default-features = false }
rust_xlsxwriter = { version = "0.100", features = ["constant_memory"] }
# the JSON Schema of the command API's answers (#399), in /openapi.json
schemars = { version = "1.2.3", default-features = false, features = ["derive", "indexmap2", "std"] }
serde = { version = "1.0.219", features = ["derive"] }
sha1 = "0.10"
terminal_size = "0.4"
rand = "0.10"
serde_json = { version = "1.0.140", features = ["preserve_order"] }
sha2 = "0.11.1"
# the directories of the tests, removed when a test ends (#685)
tempfile = "3.27"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tower-http = { version = "0.7", default-features = false }
toml = "1.1"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
# the columns text takes on a terminal (East Asian width, emoji sequences)
unicode-width = "0.2.3"
walkdir = "2.5.0"
zip = "2"
zstd = "0.14"

# Debug builds of the crypto/SQLite code are ~30x slower than release, which makes every database
# open take tens of seconds; keep the dependencies and the native database crate optimized.
[profile.dev.package."*"]
opt-level = 2
[profile.dev.package.weflow-native]
opt-level = 2

# Release builds: whole-program optimisation makes the single-file binary ~16% smaller and a few percent faster.
# Panics keep unwinding: the SQLite VFS and the C ABI catch them at the FFI boundary.
[profile.release]
lto = "thin"
codegen-units = 1

# heic-rs 0.1.4 with its 4:2:2 and 4:4:4 intra decoding fixed (tbraun96/heic-rs#15, #559) and the availability of
# a block's neighbours worked out once per block (branch perf/hevc-intra-neighbours, #1103): back to crates.io once
# a release has both
[patch.crates-io]
heic-rs = { git = "https://github.com/334456777/heic-rs", rev = "a93d683f56147ef5dcd316eef0dd01433fb04043" }
# sha2 0.11.1 whose SHA-512 AVX2 backend, picked at run time, also enables BMI1/BMI2 (RustCrypto/hashes#940, #535):
# back to crates.io once a release has it
sha2 = { git = "https://github.com/334456777/hashes", rev = "e717feec478ba9f18a0942bf7bc73194284a3eb7" }
