<svg xmlns="http://www.w3.org/2000/svg" width="200" height="240" viewBox="0 0 200 240">
  <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="1.5" dy="3" stdDeviation="1.6" flood-color="#60260e" flood-opacity=".35"/>
  </filter>
  <g stroke="#fffdf7" stroke-width="7" stroke-linejoin="round" paint-order="stroke">
    <!-- a cloud with a face -->
    <g transform="translate(78 72) rotate(-6) scale(1.35)" filter="url(#lift)">
      <path d="M-30 14 C-44 14 -44 -6 -30 -6 C-30 -24 -6 -28 0 -14 C8 -26 32 -20 28 -4 C42 -2 40 14 28 14 Z" fill="#fff1df"/>
      <g stroke="none"><circle cx="-8" cy="3" r="2.4" fill="#2a1e18"/><circle cx="8" cy="3" r="2.4" fill="#2a1e18"/>
        <circle cx="-15" cy="8" r="3.2" fill="#f4afa0"/><circle cx="15" cy="8" r="3.2" fill="#f4afa0"/></g>
      <path d="M-3 8 q3 3 6 0" fill="none" stroke="#2a1e18" stroke-width="1.6" stroke-linecap="round" paint-order="normal"/>
    </g>
    <!-- a bolt -->
    <g transform="translate(152 136) rotate(14)" filter="url(#lift)">
      <path d="M5 -30 L-14 5 L-1 5 L-6 30 L16 -8 L3 -8 Z" fill="#f6cd62"/>
    </g>
    <!-- a raindrop -->
    <g transform="translate(70 186) rotate(-12)" filter="url(#lift)">
      <path d="M0 -24 C10 -8 16 2 16 10 A16 16 0 0 1 -16 10 C-16 2 -10 -8 0 -24 Z" fill="#9dd3da"/>
      <path d="M-8 6 q-1 7 5 10" fill="none" stroke="#fffdf7" stroke-width="3" stroke-linecap="round" paint-order="normal"/>
    </g>
  </g>
</svg>
