      <path d="M-12 8 Q-6 -16 4 -26 Q8 -10 14 8" fill="none" stroke-width="9"/>
      <path d="M-12 8 Q-6 -16 4 -26 Q8 -10 14 8" fill="none" stroke="#5f9d72" stroke-width="3" paint-order="normal"/>
      <path d="M4 -26 q12 -6 18 2 q-10 6 -18 -2 Z" fill="#a9d9b6"/>
      <circle cx="-12" cy="14" r="12" fill="#e8735f"/>
      <circle cx="14" cy="14" r="12" fill="#e8735f"/>
      <g stroke="none" fill="#fffdf7"><circle cx="-16" cy="9" r="3"/><circle cx="10" cy="9" r="3"/></g>
