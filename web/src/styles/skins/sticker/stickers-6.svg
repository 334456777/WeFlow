      <path d="M-22 4 L22 4 L20 14 L-20 14 Z" fill="#c98b5e" stroke="none"/>
      <g stroke="none" fill="#2a1e18"><circle cx="-7" cy="20" r="2.2"/><circle cx="7" cy="20" r="2.2"/></g>
      <path d="M-8 -14 c-5 -6 5 -10 0 -18 M4 -14 c-5 -6 5 -10 0 -18" fill="none" stroke="#fffdf7" stroke-width="3.5" stroke-linecap="round" paint-order="normal"/>
    </g>
    <!-- a doughnut -->
    <g transform="translate(150 132) rotate(16)" filter="url(#lift)">
      <circle r="28" fill="#f6cd62"/>
      <path d="M-24 -6 Q-26 -24 -6 -26 Q14 -28 24 -10 Q28 4 20 8 Q12 4 4 10 Q-6 14 -12 6 Q-20 4 -24 -6 Z" fill="#f4afa0" stroke="none"/>
