        <circle cx="-18" cy="9" r="3.5" fill="#f4afa0"/><circle cx="18" cy="9" r="3.5" fill="#f4afa0"/>
        <path d="M-2 6 L2 6 L0 9 Z" fill="#2a1e18"/>
