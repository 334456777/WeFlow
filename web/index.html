<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfcfd" />
    <meta name="description" content="WeFlow 聊天记录工作台" />
    <link rel="icon" href="data:," />
    <title>WeFlow · 记录工作台</title>
    <script>
      // The theme (#252) and the skin (#830) in force before the first paint; src/theme.ts and src/skin.ts keep them
      // afterwards, by the same rules. A skin other than the default comes with a style sheet of its own, which
      // src/skin.ts fetches: until it is here the page stays hidden (styles/tokens.css), 3 s at most.
      (function () {
        var root = document.documentElement, choice = null, skin = null;
        try { choice = localStorage.getItem('weflow.theme'); skin = localStorage.getItem('weflow.skin'); } catch (e) {}
        var dark = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        root.dataset.theme = dark ? 'dark' : 'light';
        root.dataset.skin = skin || 'neumorphism';
        if (skin && skin !== 'neumorphism') {
          root.dataset.skinPending = '';
          setTimeout(function () { delete root.dataset.skinPending; }, 3000);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
