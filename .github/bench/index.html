<!doctype html>
<!-- The benchmark viewer on GitHub Pages (#601, #604): pick a shape of benchmark account (#610) and an environment
     of it, then any two commits measured in it, and the comparison is made here from their result.json
     (compare.mjs). Switching the shape keeps the two commits when an environment of the other shape holds them, so
     the same change can be seen on another account. The choice is kept in the address (?env=&base=&head=, a commit
     by a name it was asked by, such as a tag, or by its SHA; `?shape=` instead of `?env=` takes the newest
     environment of that shape), so a link shows the same comparison; the release notes link here.
     `?c=<base SHA>-<head SHA>` (or `?c=<head SHA>`) is the same in one parameter: the repository's autolink turns
     `BENCH-<base>-<head>` in an issue, a PR or a commit into it. bench.yml copies this file to bench/ of the gh-pages
     branch. -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WeFlow 基准测试</title>
<style>
:root{color-scheme:light dark;--fg:#1f2328;--bg:#fff;--muted:#57606a;--border:#d0d7de;--subtle:#f6f8fa;--stripe:#fafbfc;
--grid:#e5e7eb;--base:#2563eb;--head:#dc2626;--warn:#9a6700;--link:#0969da}
@media (prefers-color-scheme:dark){:root{--fg:#e6edf3;--bg:#0d1117;--muted:#9198a1;--border:#3d444d;--subtle:#151b23;
--stripe:#10151c;--grid:#262c36;--base:#4493f8;--head:#f85149;--warn:#d29922;--link:#4493f8}}
body{font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif;margin:0;padding:16px;max-width:1000px;color:var(--fg);background:var(--bg)}
a{color:var(--link)}
h1{font-size:22px}h2{font-size:18px;margin-top:32px;border-bottom:1px solid var(--border)}h3{font-size:15px}
code{font:12px ui-monospace,Consolas,monospace;background:var(--subtle);padding:1px 4px;border-radius:4px}
.scroll{overflow-x:auto}table{border-collapse:collapse;margin:8px 0 16px}
th,td{border:1px solid var(--border);padding:4px 10px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{background:var(--subtle)}tbody tr:nth-child(even){background:var(--stripe)}
svg{width:100%;max-width:720px;font:11px system-ui;fill:var(--muted)}.grid{stroke:var(--grid)}
polyline.base{stroke:var(--base)}polyline.head{stroke:var(--head)}i.base{background:var(--base)}i.head{background:var(--head)}
.legend span{margin-right:16px}.legend i{display:inline-block;width:12px;height:3px;margin-right:6px;vertical-align:middle}
form{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;padding:12px;border:1px solid var(--border);
border-radius:8px;background:var(--subtle)}
label{color:var(--muted)}select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--border);border-radius:6px;
padding:4px 6px;min-width:0;width:100%}
.note{color:var(--muted)}.warn{color:var(--warn)}
@media (max-width:560px){form{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>WeFlow 基准测试</h1>
<p class="note">每个提交在同一台自托管机器上分别测量，结果按环境（机器、测量工具、合成账号）分组；仅同一环境内的结果可相互比较。合成账号有几种形状，每种形状是单独的环境；切换形状时保留所选的两个提交，可查看同一改动在另一种账号上的表现。</p>
<form id="pick" aria-label="选择要比较的结果">
  <label for="shape">账号形状</label><select id="shape"></select>
  <label for="env">环境</label><select id="env"></select>
  <label for="base">base</label><select id="base"></select>
  <label for="head">head</label><select id="head"></select>
</form>
<p id="status" class="note" role="status" aria-live="polite">正在读取……</p>
<main id="report"></main>
<script type="module">
import { CURVES_NOTE, incomparable, inlineHtml, memorySeries, reportBlocks, svgCurves, toHtml } from './compare.mjs';

const $ = id => document.getElementById(id);
const status = (text, warn = false) => { $('status').textContent = text; $('status').className = warn ? 'warn' : 'note'; };
const escape = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const cache = new Map();
const load = path => {
  if (!cache.has(path)) cache.set(path, fetch(path, { cache: 'no-cache' }).then(r => {
    if (!r.ok) throw new Error(`${path}: ${r.status}`);
    return r.json();
  }));
  return cache.get(path);
};

let index;
const commitsOf = key => Object.entries(index.envs[key].results)
  .map(([sha, e]) => ({ sha, ...e }))
  .sort((a, b) => b.measured_at.localeCompare(a.measured_at));
const nameOf = c => (c.refs.length ? c.refs.join('，') : c.sha.slice(0, 10));
/** The commit a name in the address means: one it was asked by, or the start of its SHA. */
const find = (key, name) => name && commitsOf(key).find(c => c.refs.includes(name) || c.sha.startsWith(name.toLowerCase()));
/** How a commit is named in the address: its first name, else its SHA's start. */
const linkName = c => c.refs[0] ?? c.sha.slice(0, 12);

function envLabel(key) {
  const e = index.envs[key], list = commitsOf(key);
  const last = list[0]?.measured_at.slice(0, 10) ?? '-';
  return `${key} · ${e.machine.cpu} · ${list.length} 个提交 · 最近测量 ${last}`;
}

// the shapes bench-commits.py names (#610), in its order; an environment holds the name of its own
const SHAPE_ORDER = ['group', 'sessions', 'seed2'];
const shapeOf = key => index.envs[key].shape?.name ?? '';
const shapeLabel = name => {
  if (!name) return '未注明形状';
  const key = Object.keys(index.envs).find(k => shapeOf(k) === name);
  const label = index.envs[key]?.shape?.label ?? name;
  return label === name ? name : `${label}（${name}）`;
};
const shapeRank = name => (SHAPE_ORDER.includes(name) ? SHAPE_ORDER.indexOf(name) : name ? SHAPE_ORDER.length : Infinity);
const byShape = (a, b) => shapeRank(a) - shapeRank(b) || a.localeCompare(b);
const newestFirst = (a, b) => (commitsOf(b)[0]?.measured_at ?? '').localeCompare(commitsOf(a)[0]?.measured_at ?? '');
/** The environments, those of the shapes listed first, the newest first within a shape. */
const envKeys = () => Object.keys(index.envs).sort((a, b) => byShape(shapeOf(a), shapeOf(b)) || newestFirst(a, b));
/** Of `keys`, the first that holds both commits, else the first. */
const holding = (keys, baseName, headName) => keys.find(k => find(k, baseName) && find(k, headName)) ?? keys[0];

function fill(select, items, chosen) {
  select.replaceChildren(...items.map(([value, label]) => new Option(label, value, false, value === chosen)));
}

// by its name, not by the version the binary reports: the tags of a release candidate built a Cargo.toml that still
// held the version before
function commitLabel(c) {
  return `${nameOf(c)} · ${c.measured_at.slice(0, 16).replace('T', ' ')}${c.only ? ' · 部分测量' : ''}`;
}

function choose(key, baseName, headName) {
  const list = commitsOf(key);
  const head = find(key, headName) ?? list[0];
  const base = find(key, baseName) ?? list.find(c => c.sha !== head?.sha) ?? head;
  const shape = shapeOf(key);
  fill($('shape'), [...new Set(envKeys().map(shapeOf))].map(s => [s, shapeLabel(s)]), shape);
  fill($('env'), envKeys().filter(k => shapeOf(k) === shape).map(k => [k, envLabel(k)]), key);
  fill($('base'), list.map(c => [c.sha, commitLabel(c)]), base?.sha);
  fill($('head'), list.map(c => [c.sha, commitLabel(c)]), head?.sha);
  return { base, head };
}

async function show() {
  const key = $('env').value, base = index.envs[key].results[$('base').value], head = index.envs[key].results[$('head').value];
  const params = new URLSearchParams({ env: key, base: linkName({ sha: $('base').value, ...base }), head: linkName({ sha: $('head').value, ...head }) });
  history.replaceState(null, '', `?${params}`);
  $('report').replaceChildren();
  if ($('base').value === $('head').value) { status('base 与 head 为同一提交，请选择两个不同的提交进行比较。', true); return; }
  status('正在读取两份结果……');
  try {
    const [b, h] = await Promise.all([load(`data/${key}/${$('base').value}.json`), load(`data/${key}/${$('head').value}.json`)]);
    const why = incomparable(b, h);
    if (why) { status(why, true); return; }
    const charts = memorySeries(b, h).map(([title, series]) => `<h3>${inlineHtml(title)}</h3>${svgCurves(series)}`);
    // the page has its own title
    $('report').innerHTML = toHtml(reportBlocks(b, h).filter(block => block.h !== 1))
      + `<h2>内存曲线</h2><p>${escape(CURVES_NOTE)}</p><p class="legend"><span><i class="base"></i>base</span><span><i class="head"></i>head</span></p>`
      + charts.join('');
    status('');
  } catch (e) {
    status(`无法读取结果：${e.message}`, true);
  }
}

try {
  index = await load('data/index.json');
  const keys = Object.keys(index.envs ?? {});
  if (!keys.length) throw new Error('尚无结果');
  const q = new URLSearchParams(location.search);
  // a BENCH-<base>-<head> autolink: one parameter of SHAs, which hold no hyphen
  if (q.has('c')) {
    const [one, two] = q.get('c').split('-');
    if (two) { q.set('base', one); q.set('head', two); } else q.set('head', one);
  }
  // an address without the environment: the newest one of the shape asked for (else of any, the default shape first)
  // that holds both commits
  const ofShape = envKeys().filter(k => !q.has('shape') || shapeOf(k) === q.get('shape'));
  const key = q.has('env') && index.envs[q.get('env')] ? q.get('env')
    : holding(ofShape.length ? ofShape : envKeys(), q.get('base'), q.get('head'));
  choose(key, q.get('base'), q.get('head'));
  // another shape or environment keeps the two commits chosen, by SHA, where it holds them
  const picked = () => [$('base').value, $('head').value];
  $('shape').addEventListener('change', () => {
    const keys = envKeys().filter(k => shapeOf(k) === $('shape').value);
    choose(holding(keys, ...picked()), ...picked());
    show();
  });
  $('env').addEventListener('change', () => { choose($('env').value, ...picked()); show(); });
  $('base').addEventListener('change', show);
  $('head').addEventListener('change', show);
  await show();
} catch (e) {
  status(`无可显示的结果：${e.message}`, true);
}
</script>
</body>
</html>
