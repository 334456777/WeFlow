name: Bench

# Performance of commits measured one by one (#601): run by hand from the Actions page with the commits, or by
# release.yml after a release. Each commit is built in release, without the PGO of release.yml so that a difference
# comes from the code alone, and measured on its own on the self-hosted benchmark runner (label `weflow-bench`); its
# result goes to the gh-pages branch (bench/data/<environment>/<sha>.json), where the viewer at bench/ compares any
# two results of the same environment (`.github/bench/`). A commit the environment already holds is not measured
# again. The environment is the machine, the version of the measuring tools and the account
# (`.github/scripts/bench.py`, which says what it measures); in each run an anchor commit, the same for the whole
# environment, is measured in turns with every commit, so that two results measured apart show how far the machine
# drifted in between. The account is the synthetic benchmark account of #488, generated on the runner: real chat data
# never goes to a public repository's Actions. The tools that make the account and time the command API are built
# from the commit this workflow runs on, so every commit of a run is measured the same way.
#
# The runner is a machine of the repository's owner, so this workflow runs only when the owner starts it (or a release
# they started calls it), never for a pull request; no other workflow uses the `weflow-bench` label. The runner needs
# `WEFLOW_BENCH_DIR` in its `.env`: its own folder for the accounts, the binaries, the clone the commits are built in
# and the build cache; Rust is installed there by the first run.
on:
  workflow_dispatch:
    inputs:
      commits:
        description: "要测的提交、分支或 tag，逗号分隔（HEAD 表示运行所在分支的最新提交）；正好两个时，第一个当 base、第二个当 head 生成对比"
        required: true
        type: string
      runs:
        description: "每条命令计时运行的次数"
        required: false
        default: "5"
        type: string
      seed:
        description: "基准账号的随机种子"
        required: false
        default: "1"
        type: string
      group_messages:
        description: "基准账号最大群聊的消息数"
        required: false
        default: "200000"
        type: string
      conversations:
        description: "基准账号其他会话的个数"
        required: false
        default: "300"
        type: string
      load_seconds:
        description: "weflow serve 持续请求的秒数（0 表示跳过）"
        required: false
        default: "90"
        type: string
      only:
        description: "只测这些项目，逗号分隔：命令名（见 bench.py，如 export messages json）、load、serve_bench；留空测全部"
        required: false
        default: ""
        type: string
      force:
        description: "已经测过的提交也重新测量"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "给已发布的版本补上「性能基准」一节时填它的 tag（commits 要正好两个：上一个版本、这个版本）；留空不改"
        required: false
        default: ""
        type: string
  # release.yml runs it after publishing a release (#516) with the previous release and the new tag
  workflow_call:
    inputs:
      commits:
        required: true
        type: string
      runs:
        required: false
        default: "5"
        type: string
      load_seconds:
        required: false
        default: "90"
        type: string
      release_tag:
        required: false
        default: ""
        type: string
    outputs:
      viewer_url:
        description: "The comparison of the two commits in the viewer (empty unless two were given)"
        value: ${{ jobs.publish.outputs.url }}

permissions:
  contents: read

# one run at a time on the runner
concurrency:
  group: bench
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-pc-windows-msvc

jobs:
  measure:
    name: measure
    if: github.actor == github.repository_owner
    runs-on: [self-hosted, Windows, X64, weflow-bench]
    timeout-minutes: 720
    steps:
      # `bash` is Git's, not the WSL launcher in System32 that comes first on the machine's PATH
      - name: Put Git's bash first
        shell: powershell
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare the runner
        shell: bash
        run: |
          : "${WEFLOW_BENCH_DIR:?the runner has no WEFLOW_BENCH_DIR in its .env}"
          dir=$(cygpath -m "$WEFLOW_BENCH_DIR")
          {
            echo "BENCH_DIR=$dir"
            echo "CARGO_HOME=$dir/cargo"
            echo "RUSTUP_HOME=$dir/rustup"
            echo "CARGO_TARGET_DIR=$dir/target"
          } >> "$GITHUB_ENV"
          echo "$dir/cargo/bin" >> "$GITHUB_PATH"
          if [ ! -x "$dir/cargo/bin/rustup.exe" ]; then
            curl -sSfLo "$RUNNER_TEMP/rustup-init.exe" https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe
            CARGO_HOME="$dir/cargo" RUSTUP_HOME="$dir/rustup" "$RUNNER_TEMP/rustup-init.exe" -y --no-modify-path \
              --default-toolchain none --profile minimal
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install psutil
        shell: bash
        run: python -m pip install --quiet psutil==7.2.2

      - name: Build the tools
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"
          cargo build --release -p weflow-cli --target "$TARGET" --bin weflow --example bench_account --example serve_bench
          mkdir -p tools
          cp "$CARGO_TARGET_DIR/$TARGET/release/weflow.exe" "$CARGO_TARGET_DIR/$TARGET/release/examples/bench_account.exe" \
            "$CARGO_TARGET_DIR/$TARGET/release/examples/serve_bench.exe" tools/

      - name: Read what gh-pages holds
        shell: bash
        run: |
          git fetch -q origin gh-pages
          git show origin/gh-pages:bench/data/index.json > index.json 2>/dev/null || rm -f index.json

      - name: Measure
        shell: bash
        env:
          COMMITS: ${{ inputs.commits }}
          RUNS: ${{ inputs.runs }}
          SEED: ${{ inputs.seed || '1' }}
          GROUP_MESSAGES: ${{ inputs.group_messages || '200000' }}
          CONVERSATIONS: ${{ inputs.conversations || '300' }}
          LOAD_SECONDS: ${{ inputs.load_seconds }}
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          python .github/scripts/bench-commits.py --commits "$COMMITS" --bench-dir "$BENCH_DIR" --tools tools \
            --index index.json --out results --runs "$RUNS" --load-seconds "$LOAD_SECONDS" --only "$ONLY" \
            --seed "$SEED" --group-messages "$GROUP_MESSAGES" --conversations "$CONVERSATIONS" $FORCE

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-results
          path: results/
          retention-days: 30

  # The results into the gh-pages branch with the viewer (bench-publish.py); with two commits, their comparison on
  # the run's page, and with `release_tag` the 性能基准 section of that release's notes.
  publish:
    name: publish
    needs: measure
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    outputs:
      url: ${{ steps.compare.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: main
          sparse-checkout: .github
          sparse-checkout-cone-mode: false

      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages

      - uses: actions/download-artifact@v8
        with:
          name: bench-results
          path: results

      - id: push
        name: Push to gh-pages
        shell: bash
        run: |
          python3 main/.github/scripts/bench-publish.py --pages pages --results results --viewer main/.github/bench \
            > published.txt
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A bench
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "bench: results of $(sed -n 1p ../published.txt)"
          # another publish may have pushed in between: take it and try again
          for attempt in 1 2 3 4; do
            git push origin HEAD:gh-pages && break
            [ "$attempt" = 4 ] && exit 1
            sleep $((attempt * 5))
            git pull -q --rebase origin gh-pages
          done

      - id: compare
        name: Compare the two commits
        shell: bash
        env:
          COMMITS: ${{ inputs.commits }}
        run: |
          IFS=, read -ra refs <<< "$COMMITS"
          mapfile -t lines < published.txt
          key=${lines[0]}
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          viewer="https://$owner.github.io/${GITHUB_REPOSITORY#*/}/bench/"
          echo "Viewer: $viewer?env=$key" >> "$GITHUB_STEP_SUMMARY"
          if [ "${#refs[@]}" != 2 ]; then exit 0; fi
          # a name in the link when it says more than the commit itself
          name() { local r; r=$(echo "$1" | xargs); if [ "$r" = HEAD ] || [[ "$2" == "$r"* ]]; then echo "${2:0:12}"; else echo "$r"; fi; }
          url="$viewer?env=$key&base=$(name "${refs[0]}" "${lines[1]}")&head=$(name "${refs[1]}" "${lines[2]}")"
          node main/.github/bench/cli.mjs "pages/bench/data/$key/${lines[1]}.json" "pages/bench/data/$key/${lines[2]}.json" \
            --out compare --url "$url" > /dev/null
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Add the benchmark to the release notes
        if: inputs.release_tag != '' && steps.compare.outputs.url != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          COMMITS: ${{ inputs.commits }}
          URL: ${{ steps.compare.outputs.url }}
        run: bash main/.github/scripts/release-bench-notes.sh "$TAG" "$(echo "${COMMITS%%,*}" | xargs)" "$URL" compare/highlights.md
