name: Bench

# Performance of commits measured one by one (#601): run by hand from the Actions page with the commits, or by
# release.yml after a release. Each commit is built in release, without the PGO of release.yml so that a difference
# comes from the code alone, and measured on its own on the self-hosted benchmark runner (label `weflow-bench`); its
# result goes to the gh-pages branch (bench/data/<environment>/<sha>.json), where the viewer at bench/ compares any
# two results of the same environment (`.github/bench/`). A commit the environment already holds is not measured
# again. The environment is the machine, the version of the measuring tools and the account
# (`.github/scripts/bench.py`, which says what it measures); in each run an anchor commit, the same for the whole
# environment, is measured in turns with every commit, so that two results measured apart show how far the machine
# drifted in between. The account is the synthetic benchmark account of #488, generated on the runner: real chat data
# never goes to a public repository's Actions. The tools that make the account and time the command API are built
# from the commit this workflow runs on, so every commit of a run is measured the same way.
#
# The runner is a machine of the repository's owner, so this workflow runs only when the owner starts it (or a release
# they started calls it), never for a pull request; no other workflow uses the `weflow-bench` label. The runner needs
# `WEFLOW_BENCH_DIR` in its `.env`: its own folder, kept between runs so that nothing a run before set up is
# installed, downloaded or written again (Rust, the build cache, the account, the anchor's binary), and cleaned after
# each run of what the next one will not use (`.github/scripts/bench-runner.sh`).
#
# With `night` (the default), commits are measured only during the night in Japan, 23:30 to 05:00, when nobody uses
# the machine: the wait job holds the run until then, on the runner, and the measure job starts no commit once the
# night is over. The commits it leaves are postponed: the publish job starts another run of this workflow with them
# (as github-actions[bot], the one actor besides the owner allowed to run it), which waits for the next night. The wait
# is a job of its own so that the measure job's tokens are fresh when it starts. The calibration task of #605
# (`.github/bench/calibrate.ps1`) starts a run on the releases and the PRs labeled `bench` when the profile changed.
on:
  workflow_dispatch:
    inputs:
      commits:
        description: "要测的提交、分支或 tag，逗号分隔（HEAD 表示运行所在分支的最新提交；分支记成 分支@提交，如 main@74185784f6；写成 名字=提交 时查看页显示这个名字，如 #424前=c054035f^）；正好两个时，第一个当 base、第二个当 head，运行页面的「发布」一节给出它们的对比链接"
        required: true
        type: string
      runs:
        description: "每条命令计时运行的次数"
        required: false
        default: "5"
        type: string
      seed:
        description: "基准账号的随机种子"
        required: false
        default: "1"
        type: string
      group_messages:
        description: "基准账号最大群聊的消息数"
        required: false
        default: "200000"
        type: string
      conversations:
        description: "基准账号其他会话的个数"
        required: false
        default: "300"
        type: string
      load_seconds:
        description: "weflow serve 持续请求的秒数（0 表示跳过）"
        required: false
        default: "90"
        type: string
      only:
        description: "只测这些项目，逗号分隔：命令名（见 bench.py，如 export messages json）、load、serve_bench；留空测全部"
        required: false
        default: ""
        type: string
      force:
        description: "已经测过的提交也重新测量"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "补写某个已发布版本的「性能基准」：填它的 tag，commits 填「上一个版本,这个版本」；留空不改任何 release"
        required: false
        default: ""
        type: string
      night:
        description: "只在日本时间 23:30–05:00 测量：不在这个时段时等到 23:30；时段结束时没测完的提交另起一次运行，等下一个夜间时段"
        required: false
        default: true
        type: boolean
  # release.yml runs it after publishing a release (#516) with the previous release and the new tag
  workflow_call:
    inputs:
      commits:
        required: true
        type: string
      runs:
        required: false
        default: "5"
        type: string
      load_seconds:
        required: false
        default: "90"
        type: string
      release_tag:
        required: false
        default: ""
        type: string
      night:
        required: false
        default: true
        type: boolean
    outputs:
      viewer_url:
        description: "The comparison of the two commits in the viewer (empty unless two were given)"
        value: ${{ jobs.publish.outputs.url }}

permissions:
  contents: read

# one run at a time on the runner
concurrency:
  group: bench
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-pc-windows-msvc

jobs:
  # until the night in Japan; skipped without `night`
  wait:
    name: wait for the night
    if: inputs.night && (github.actor == github.repository_owner || github.actor == 'github-actions[bot]')
    runs-on: [self-hosted, Windows, X64, weflow-bench]
    timeout-minutes: 1200
    steps:
      - name: Find Git
        shell: cmd
        run: '>>"%GITHUB_PATH%" echo C:\Program Files\Git\cmd'

      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Wait
        shell: cmd
        run: '"C:\Program Files\Git\bin\bash.exe" --noprofile --norc .github/scripts/bench-runner.sh wait'

  measure:
    name: measure
    needs: wait
    if: >-
      !cancelled() && (needs.wait.result == 'success' || needs.wait.result == 'skipped')
      && (github.actor == github.repository_owner || github.actor == 'github-actions[bot]')
    runs-on: [self-hosted, Windows, X64, weflow-bench]
    timeout-minutes: 720
    # The steps run .github/scripts/bench-runner.sh through cmd with Git's bash by its full path: the runner finds a
    # `shell: bash` on its own PATH, where System32's WSL launcher comes first.
    steps:
      # the runner's own PATH has no Git, and actions/checkout without it downloads an archive instead of a clone
      - name: Find Git
        shell: cmd
        run: '>>"%GITHUB_PATH%" echo C:\Program Files\Git\cmd'

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build and measure
        shell: cmd
        env:
          COMMITS: ${{ inputs.commits }}
          RUNS: ${{ inputs.runs }}
          SEED: ${{ inputs.seed || '1' }}
          GROUP_MESSAGES: ${{ inputs.group_messages || '200000' }}
          CONVERSATIONS: ${{ inputs.conversations || '300' }}
          LOAD_SECONDS: ${{ inputs.load_seconds }}
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force && '1' || '' }}
          NIGHT: ${{ inputs.night && '1' || '' }}
        run: '"C:\Program Files\Git\bin\bash.exe" --noprofile --norc .github/scripts/bench-runner.sh measure'

      # the results alone, a few small files, and how the run went: a run whose upload fails keeps the results in the
      # runner's pending/ folder (bench-commits.py), and the next run publishes them
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-results
          path: |
            results/run.json
            results/summary.md
            results/*/result.json
          retention-days: 30

      # the output of every command, for looking into a run; publishing does not wait on it
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: bench-logs
          path: results/*/logs/
          retention-days: 7

      # what the next run will not use
      - name: Clean up
        if: always()
        shell: cmd
        run: '"C:\Program Files\Git\bin\bash.exe" --noprofile --norc .github/scripts/bench-runner.sh clean'

  # How the run went on the run's Summary page, written here rather than on the runner, whose network may drop the
  # upload; the results into the gh-pages branch with the viewer (bench-publish.py), which adds what was published to
  # the page and, with two commits, the link to their comparison; with `release_tag` the 性能基准 section of that
  # release's notes; the postponed commits to another run.
  publish:
    name: publish
    needs: measure
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write   # the run for the postponed commits
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    outputs:
      url: ${{ steps.push.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: main
          sparse-checkout: .github
          sparse-checkout-cone-mode: false

      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages

      - uses: actions/download-artifact@v8
        with:
          name: bench-results
          path: results

      - id: push
        name: Push to gh-pages
        shell: bash
        run: |
          if [ -f results/summary.md ]; then cat results/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          python3 main/.github/scripts/bench-publish.py --pages pages --results results --viewer main/.github/bench \
            > published.txt
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A bench
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "bench: results of $(sed -n 1p ../published.txt)"
          # another publish may have pushed in between: take it and try again
          for attempt in 1 2 3 4; do
            git push origin HEAD:gh-pages && break
            [ "$attempt" = 4 ] && exit 1
            sleep $((attempt * 5))
            git pull -q --rebase origin gh-pages
          done

      # the base and the head (bench-publish.py gives them when two commits were asked for and both are held): the few
      # lines of the release notes, and the comparison's address in them
      - name: Add the benchmark to the release notes
        if: inputs.release_tag != '' && steps.push.outputs.url != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          COMMITS: ${{ inputs.commits }}
          KEY: ${{ steps.push.outputs.key }}
          BASE: ${{ steps.push.outputs.base }}
          HEAD: ${{ steps.push.outputs.head }}
          URL: ${{ steps.push.outputs.url }}
        run: |
          node main/.github/bench/cli.mjs "pages/bench/data/$KEY/$BASE.json" "pages/bench/data/$KEY/$HEAD.json" --out compare
          # the base by the name it was asked by (a run started for postponed commits has them as name=SHA)
          base=$(echo "${COMMITS%%,*}" | xargs)
          bash main/.github/scripts/release-bench-notes.sh "$TAG" "${base%%=*}" "$URL" compare/highlights.md

      # the commits the night was over for: another run of this workflow, on the same branch and with the same options,
      # which waits for the next night (a run started with the GITHUB_TOKEN is the one kind of run it may start)
      - name: Postpone the rest to the next night
        if: steps.push.outputs.next_commits != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.push.outputs.next_commits }}
          NEXT_FORCE: ${{ steps.push.outputs.next_force }}
          RUNS: ${{ inputs.runs }}
          SEED: ${{ inputs.seed || '1' }}
          GROUP_MESSAGES: ${{ inputs.group_messages || '200000' }}
          CONVERSATIONS: ${{ inputs.conversations || '300' }}
          LOAD_SECONDS: ${{ inputs.load_seconds }}
          ONLY: ${{ inputs.only }}
          TAG: ${{ inputs.release_tag }}
        run: |
          gh workflow run bench.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f commits="$NEXT" \
            -f runs="$RUNS" -f seed="$SEED" -f group_messages="$GROUP_MESSAGES" -f conversations="$CONVERSATIONS" \
            -f load_seconds="$LOAD_SECONDS" -f only="$ONLY" -f force="$NEXT_FORCE" -f release_tag="$TAG" -f night=true
          echo "- 已另起一次运行测延后的提交：https://github.com/$GITHUB_REPOSITORY/actions/workflows/bench.yml" \
            >> "$GITHUB_STEP_SUMMARY"
