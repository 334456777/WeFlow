name: Bench

# Performance of commits measured one by one (#601): run by hand from the Actions page with the commits, or by
# release.yml after a release. Each commit is built in release, without the PGO of release.yml so that a difference
# comes from the code alone, and measured on its own on the self-hosted benchmark runner (label `weflow-bench`); its
# result goes to the gh-pages branch (bench/data/<environment>/<sha>.json), where the viewer at bench/ compares any
# two results of the same environment (`.github/bench/`). A commit the environment already holds is not measured
# again. The environment is the machine, the version of the measuring tools and the account
# (`.github/scripts/bench.py`, which says what it measures); in each run an anchor commit, the same for the whole
# environment, is measured in turns with every commit, so that two results measured apart show how far the machine
# drifted in between. The account is the synthetic benchmark account of #488, generated on the runner: real chat data
# never goes to a public repository's Actions. The tools that make the account and time the command API are built
# from the commit this workflow runs on, so every commit of a run is measured the same way.
#
# The runner is a machine of the repository's owner, so this workflow runs only when the owner starts it (or a release
# they started calls it) or on its schedule, never for a pull request; no other workflow uses the `weflow-bench`
# label. The runner needs `WEFLOW_BENCH_DIR` in its `.env`: its own folder, kept between runs so that nothing a run
# before set up is installed, downloaded or written again (Rust, the build cache, the account, the anchor's binary),
# and cleaned after each run of what the next one will not use (`.github/scripts/bench-runner.sh`).
#
# With `night` (the default), commits are measured at night in Japan, 23:30 to 05:00
# (#688): the queue job puts the request at the end of the queue on the gh-pages branch (bench/queue.json,
# `.github/scripts/bench_queue.py`) and the run ends; a night's run measures the requests there in order from 23:30,
# and one asked for during the night is measured at once. Once the night is over no further commit starts, and what is
# left stays in the queue for the next night. A night's run is a run of this workflow's schedule, or one started by
# hand on the default branch with no commits: `.github/bench/night.ps1`, a task of Windows on the runner's computer,
# starts one every night at 23:25 (#1001), at once and only while that computer is on. GitHub starts a run of the
# schedule hours late at times, and drops some (#957): the schedule fires three times before the night, for a night the
# task misses. A night's run that comes before 23:30 waits for it in the queue job, on GitHub's machine, and the first
# one of the night takes the queue, while a later one that night or one after the night leaves the runner alone (the
# queue's `taken`). Nothing waits in a concurrency group, where a run queued behind another is cancelled by the next:
# the runner takes one job at a time, the others wait for it in turn, and the pushes to gh-pages try again on a fresh
# checkout when another push came first. `night` off measures at once, after whatever the runner is doing, and so does
# a run started on another branch than the default one: the queue is measured and published by the default branch's
# workflow, so a trial on a branch with its publish job turned off stays a trial. A night's run first queues each PR
# labeled `bench` merged since it last looked, before and after it, once (the queue's `labeled` holds the PRs it looked
# at). It asks for the runner only when there is something for it: a request in the queue, or Friday night, after the
# calibration task of #605
# (`.github/bench/calibrate.ps1`) ran: when it changed the profile, the new environment is measured first on the
# releases and the PRs labeled `bench`, from 23:30, so it has the whole night. A run whose runner is not there leaves
# the queue as it is for the next night.
on:
  workflow_dispatch:
    inputs:
      commits:
        description: "要测的提交、分支或 tag，逗号分隔（HEAD 表示运行所在分支的最新提交；分支记成 分支@提交，如 main@74185784f6；写成 名字=提交 时查看页显示这个名字，如 #424前=c054035f^）；正好两个时，第一个当 base、第二个当 head，运行页面的「发布」一节给出它们的对比链接；留空时作为夜间运行，与定时运行相同：等到 23:30，排入带 bench 标签的 PR 并测量队列"
        required: false
        default: ""
        type: string
      runs:
        description: "每条命令计时运行的次数"
        required: false
        default: "5"
        type: string
      seed:
        description: "基准账号的随机种子"
        required: false
        default: "1"
        type: string
      group_messages:
        description: "基准账号最大群聊的消息数"
        required: false
        default: "200000"
        type: string
      conversations:
        description: "基准账号其他会话的个数"
        required: false
        default: "300"
        type: string
      load_seconds:
        description: "weflow serve 持续请求的秒数（0 表示跳过）"
        required: false
        default: "90"
        type: string
      only:
        description: "只测这些项目，逗号分隔：命令名（见 bench.py，如 export messages json）、load、serve_bench；留空测全部"
        required: false
        default: ""
        type: string
      force:
        description: "已经测过的提交也重新测量"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "补写某个已发布版本的「性能基准」：填它的 tag，commits 填「上一个版本,这个版本」；留空不改任何 release"
        required: false
        default: ""
        type: string
      night:
        description: "排进夜间队列，在日本时间 23:30–05:00 测量（现在已是夜间则立即开始）；关掉则立即测量"
        required: false
        default: true
        type: boolean
  # release.yml runs it after publishing a release (#516) with the previous release and the new tag
  workflow_call:
    inputs:
      commits:
        required: true
        type: string
      runs:
        required: false
        default: "5"
        type: string
      load_seconds:
        required: false
        default: "90"
        type: string
      release_tag:
        required: false
        default: ""
        type: string
      night:
        required: false
        default: true
        type: boolean
  # the queue, every night from 23:30 in Japan: fired at 12:47, 15:17 and 18:17 there, off the hour, as GitHub may start
  # a run of the schedule hours late or drop it (#957; 5 to 9 hours late in its runs). A run that comes before the night
  # waits for it in the queue job, 5h30m at most, so each time reaches 23:30 for its own span of delays: 18:17 up to
  # 5h13m late, 15:17 from 2h43m to 8h13m, 12:47 from 5h13m to 10h43m; one that comes earlier than its wait allows only
  # looks for PRs labeled bench
  schedule:
    - cron: "47 3 * * *"
    - cron: "17 6 * * *"
    - cron: "17 9 * * *"

permissions:
  contents: read
  # the PRs labeled bench, which a new environment is measured on first (the measure job's backfill)
  issues: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-pc-windows-msvc

jobs:
  # The request into the queue, or straight to the measure job with `night` off; whether to measure now, and what.
  queue:
    name: queue
    if: github.actor == github.repository_owner || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # the PRs labeled bench, read by a night's run
      issues: read
      pull-requests: read
    # a hosted job's limit, which the wait for the night stays within
    timeout-minutes: 360
    env:
      # a night's run: one of the schedule, or one started by hand with no commits (.github/bench/night.ps1); a call
      # from release.yml always passes commits
      NIGHT_RUN: >-
        ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.commits == ''))
        && '1' || '' }}
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      request: ${{ steps.plan.outputs.request }}
    steps:
      # A night's run that comes before 23:30 in Japan waits here for the night, so that it checks out what the
      # repository and the queue hold by then; one that comes during the night goes on at once, and one that comes
      # after the night, or earlier than this wait allows, only looks for PRs labeled bench (bench_queue.py).
      - name: Wait for the night
        if: env.NIGHT_RUN == '1'
        shell: bash
        run: |
          # seconds into the day in Japan, which keeps no summer time, and from there to 23:30 (bench_queue.py's NIGHT)
          now=$(( ($(date -u +%s) + 9 * 3600) % 86400 ))
          left=$(( 23 * 3600 + 30 * 60 - now ))
          if [ "$left" -gt 0 ] && [ "$left" -le $(( 5 * 3600 + 30 * 60 )) ]; then
            echo "waiting $((left / 60)) minutes for 23:30 in Japan"
            sleep "$left"
          fi

      # the history and the tags, to resolve the commits asked for
      - uses: actions/checkout@v7
        with:
          path: main
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages

      - id: plan
        name: Plan
        shell: bash
        env:
          # `night` for a night's run, which bench_queue.py treats alike whatever started it
          EVENT: ${{ env.NIGHT_RUN == '1' && 'night' || github.event_name }}
          NIGHT: ${{ (github.event_name == 'schedule' || inputs.night) && '1' || '' }}
          # the queue is measured by the default branch's workflow, whose publish job is on: a run started on another
          # branch (a trial with its publish turned off) is measured in its own run instead
          OTHER_BRANCH: ${{ github.ref_name != github.event.repository.default_branch && github.ref_name || '' }}
          COMMITS: ${{ inputs.commits }}
          RUNS: ${{ inputs.runs }}
          SEED: ${{ inputs.seed }}
          GROUP_MESSAGES: ${{ inputs.group_messages }}
          CONVERSATIONS: ${{ inputs.conversations }}
          LOAD_SECONDS: ${{ inputs.load_seconds }}
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force && '1' || '' }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          # for the PRs labeled bench merged since the last night's run (bench_queue.py's api)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git -C pages config user.name "github-actions[bot]"
          git -C pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # another run may have pushed in between: plan again on what it pushed
          for attempt in 1 2 3 4 5; do
            (cd main && python3 .github/scripts/bench_queue.py plan --pages ../pages --event "$EVENT" ${NIGHT:+--night} \
              --outputs ../plan.txt --summary ../plan.md)
            git -C pages add -A bench
            if git -C pages diff --cached --quiet; then break; fi
            git -C pages commit -q -m "bench: queue a request of run $GITHUB_RUN_ID"
            git -C pages push -q origin HEAD:gh-pages && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 5))
            git -C pages fetch -q origin gh-pages
            git -C pages reset -q --hard origin/gh-pages
          done
          cat plan.txt >> "$GITHUB_OUTPUT"
          cat plan.md >> "$GITHUB_STEP_SUMMARY"

  measure:
    name: measure
    needs: queue
    if: needs.queue.outputs.mode == 'now' || needs.queue.outputs.mode == 'drain'
    runs-on: [self-hosted, Windows, X64, weflow-bench]
    timeout-minutes: 720
    # The steps run .github/scripts/bench-runner.sh through cmd with Git's bash by its full path: the runner finds a
    # `shell: bash` on its own PATH, where System32's WSL launcher comes first.
    steps:
      # the runner's own PATH has no Git, and actions/checkout without it downloads an archive instead of a clone
      - name: Find Git
        shell: cmd
        run: '>>"%GITHUB_PATH%" echo C:\Program Files\Git\cmd'

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build and measure
        shell: cmd
        env:
          MODE: ${{ needs.queue.outputs.mode }}
          REQUEST: ${{ needs.queue.outputs.request }}
          # read-only, for the releases and the PRs labeled bench a new environment is measured on first
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: '"C:\Program Files\Git\bin\bash.exe" --noprofile --norc .github/scripts/bench-runner.sh measure'

      # the results alone, a few small files, and how the run went: a run whose upload fails keeps the results in the
      # runner's pending/ folder (bench-commits.py), and the next run publishes them
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-results
          path: |
            results/summary.md
            results/*/run.json
            results/*/summary.md
            results/*/*/result.json
          # only handed to the publishing job of this run: the results live on gh-pages
          retention-days: 7

      # the output of every command, for looking into a run; publishing does not wait on it
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: bench-logs
          path: results/*/*/logs/
          retention-days: 7

      # what the next run will not use
      - name: Clean up
        if: always()
        shell: cmd
        run: '"C:\Program Files\Git\bin\bash.exe" --noprofile --norc .github/scripts/bench-runner.sh clean'

  # How the run went on the run's Summary page, written here rather than on the runner, whose network may drop the
  # upload; each request's results into the gh-pages branch with the viewer (bench-publish.py), with two commits the
  # link to their comparison and, with `release_tag`, the 性能基准 section of that release's notes; the requests
  # measured out of the queue (bench_queue.py done).
  publish:
    name: publish
    needs: measure
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: main
          sparse-checkout: .github
          sparse-checkout-cone-mode: false

      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: pages

      - uses: actions/download-artifact@v8
        with:
          name: bench-results
          path: results

      - name: Push to gh-pages
        shell: bash
        run: |
          git -C pages config user.name "github-actions[bot]"
          git -C pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          requests=$(find results -mindepth 2 -maxdepth 2 -name run.json -printf '%h\n' | sort -V)
          # another run may have pushed in between: publish again on what it pushed
          for attempt in 1 2 3 4 5; do
            keys=()
            for dir in $requests; do
              keys+=("$(python3 main/.github/scripts/bench-publish.py --pages pages --results "$dir" \
                --viewer main/.github/bench --outputs "$dir/outputs.txt" --summary "$dir/published.md")")
            done
            python3 main/.github/scripts/bench_queue.py done --pages pages --results results
            git -C pages add -A bench
            if git -C pages diff --cached --quiet; then break; fi
            git -C pages commit -q -m "bench: results of ${keys[*]:-no commit}"
            git -C pages push -q origin HEAD:gh-pages && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 5))
            git -C pages fetch -q origin gh-pages
            git -C pages reset -q --hard origin/gh-pages
          done
          {
            if [ -f results/summary.md ]; then cat results/summary.md; fi
            for dir in $requests; do
              cat "$dir/summary.md"
              printf '#### 发布\n\n'
              cat "$dir/published.md"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # each request with a release tag whose base and head are both held: the few lines of the release notes, and the
      # comparison's address in them
      - name: Add the benchmark to the release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for out in $(find results -mindepth 2 -maxdepth 2 -name outputs.txt | sort -V); do
            get() { sed -n "s/^$1=//p" "$out"; }
            tag=$(get release_tag) url=$(get url)
            [ -n "$tag" ] && [ -n "$url" ] || continue
            dir=$(dirname "$out")
            node main/.github/bench/cli.mjs "pages/bench/data/$(get key)/$(get base).json" \
              "pages/bench/data/$(get key)/$(get head).json" --out "$dir/compare"
            bash main/.github/scripts/release-bench-notes.sh "$tag" "$(get base_name)" "$url" "$dir/compare/highlights.md"
          done
