name: Release

# Build the `weflow` CLI for Windows, Linux and macOS, test it and publish a GitHub Release. Two ways to start it:
# - push a tag such as v0.0.1;
# - run it by hand (Actions → Release → Run workflow) with a tag: an existing tag is released as is, a new one is
#   created as an annotated tag on the latest commit of the branch picked in "Use workflow from" just before the
#   release is published.
# Releases use annotated tags only (git tag -a); a lightweight tag is refused.
# The jobs run in order: prepare (resolve the tag to a commit), build (profile-guided release binaries for every
# target, .github/scripts/pgo-build.sh), test (on
# every target: the test suite, and the packaged binary run once and checked against the tag), release (only after
# every build and test passed). v1.2.3 is published as a stable release; any tag with letters (v1.2.3-beta.1,
# v1.2.3-rc1, ...) is a pre-release.
# A manual run with `bench` also runs bench.yml after the release (#516, #601): `bench_base` and the tag, by default
# the previous release, each measured on the benchmark runner unless already measured; the link to their comparison
# in the viewer on GitHub Pages, with a few lines, goes into the release notes.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v2.1.2 (created as an annotated tag on the selected branch if it does not exist)"
        required: true
        type: string
      notes:
        description: "Optional text shown above the generated changelog (更新日志)"
        required: false
        type: string
      bench:
        description: "发布后在基准 runner 上测这个版本（上一个版本没测过时一起测），把对比链接和主要结论补进更新日志（不影响发布）"
        required: false
        default: false
        type: boolean
      bench_base:
        description: "基准测试用来对比的 tag 或提交；留空时是上一个版本（正式版对比上一个正式版）"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Resolve the tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
      new: ${{ steps.tag.outputs.new }}
      bench_base: ${{ steps.bench.outputs.bench_base }}
    steps:
      - uses: actions/checkout@v7

      - id: tag
        name: Resolve the tag
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        # the checks (a release tag, annotated) and their messages are in the script, which Actions does not print
        # as it does a step's own lines
        run: bash .github/scripts/release-check.sh tag "$TAG"

      - id: bench
        name: Pick the benchmark base
        if: inputs.bench
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          BASE: ${{ inputs.bench_base }}
        run: bash .github/scripts/release-check.sh bench-base "$TAG" "$BASE"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
            ext: .exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            name: windows-arm64
            ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
            ext: ""
          - os: macos-15
            target: aarch64-apple-darwin
            name: macos-arm64
            ext: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-x64
            ext: ""
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # build.rs takes the version from `git describe`; a manual run may release a tag that does not exist yet.
      - name: Tag the checkout
        shell: bash
        run: git tag -f "$TAG"

      - name: Install Rust (version from rust-toolchain.toml)
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Profile-guided (#500): an instrumented build trained on a synthetic account, then the build with its profile
      - name: Build
        shell: bash
        run: bash .github/scripts/pgo-build.sh ${{ matrix.target }} "${{ matrix.ext }}"

      - name: Package
        shell: bash
        run: |
          DIR="weflow-${TAG}-${{ matrix.name }}"
          mkdir "$DIR"
          cp "target/${{ matrix.target }}/release/weflow${{ matrix.ext }}" "$DIR/"
          cp README.md LICENSE "$DIR/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$DIR.zip" "$DIR" > /dev/null
            echo "ASSET=$DIR.zip" >> "$GITHUB_ENV"
          else
            # Owner 0:0 instead of the runner's account, so extracting as root does not restore an unrelated UID.
            if [ "${{ runner.os }}" = "macOS" ]; then
              tar --uid 0 --gid 0 --numeric-owner -czf "$DIR.tar.gz" "$DIR"
            else
              tar --owner=0 --group=0 --numeric-owner -czf "$DIR.tar.gz" "$DIR"
            fi
            echo "ASSET=$DIR.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then sha256sum "$ASSET" > "$ASSET.sha256"; else shasum -a 256 "$ASSET" > "$ASSET.sha256"; fi
          cat "$ASSET.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: weflow-${{ matrix.name }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

  test:
    name: Test ${{ matrix.target }}
    needs: [prepare, build]
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        # Every release target, while ci.yml only tests the three main platforms.
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
            ext: .exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            name: windows-arm64
            ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
            ext: ""
          - os: macos-15
            target: aarch64-apple-darwin
            name: macos-arm64
            ext: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-x64
            ext: ""
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # the checks as this workflow has them: the release's commit may be older than the script (an existing tag)
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: workflow
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          name: weflow-${{ matrix.name }}
          path: dist

      # build.rs takes the version from the tag and falls back to Cargo.toml, so a mismatch means the release was
      # started without aligning the version first.
      - name: Run the packaged binary
        shell: bash
        working-directory: dist
        env:
          WEFLOW_HOME: ${{ runner.temp }}/weflow-home
        # checksums, the files of the package, --version against the tag: in the script, as above
        run: bash ../workflow/.github/scripts/release-check.sh package "$TAG" "${{ matrix.name }}" "${{ matrix.ext }}"

      - name: Install Rust (version from rust-toolchain.toml)
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-test

      - name: Check formatting
        if: matrix.name == 'linux-x64'
        shell: bash
        run: cargo fmt --all -- --check

      # Run Clippy on Linux, macOS and Windows to cover platform-specific code.
      - name: Clippy
        if: matrix.name == 'linux-x64' || matrix.name == 'macos-arm64' || matrix.name == 'windows-x64'
        shell: bash
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test suite
        shell: bash
        run: cargo test --workspace --target ${{ matrix.target }}

  release:
    name: Publish release
    needs: [prepare, build, test]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      SHA: ${{ needs.prepare.outputs.sha }}
    permissions:
      contents: write
      id-token: write       # sign the attestation
      attestations: write   # store the attestation
      issues: read          # the changelog lists issues
      pull-requests: read   # and pull requests
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0    # the changelog reads the history since the previous release

      # The binaries take their version from the tag; Cargo.toml's version only shows in builds without git (the
      # "Source code" archives), so a stale one is a warning, not a reason to stop the release.
      - name: Compare Cargo.toml with the tag
        shell: bash
        run: |
          # Only stable releases (plain vX.Y.Z, the same rule as below); pre-releases are expected to differ.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$TAG is a pre-release, not compared"
            exit 0
          fi
          CARGO_VERSION="$(awk '/^\[workspace\.package\]/ { f = 1; next } /^\[/ { f = 0 }
            f && /^version *=/ { gsub(/^[^"]*"|".*$/, ""); print; exit }' Cargo.toml)"
          if [ "$CARGO_VERSION" != "${TAG#v}" ]; then
            MSG="Cargo.toml says $CARGO_VERSION but the tag is $TAG; source archives built without git will report $CARGO_VERSION"
            echo "::warning::$MSG"
            echo "> [!WARNING]" >> "$GITHUB_STEP_SUMMARY"
            echo "> $MSG" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Cargo.toml matches the tag ($CARGO_VERSION)"
          fi

      # The 更新日志 section: the optional `notes` input, then what .github/scripts/release-changelog.sh lists
      # since the previous release (closed issues by label, pull requests without an issue, new open issues).
      - name: Write the changelog
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ inputs.notes }}
        run: |
          {
            if [ -n "$NOTES" ]; then printf '%s\n\n' "$NOTES"; fi
            bash .github/scripts/release-changelog.sh "$TAG" "$SHA"
          } > "$RUNNER_TEMP/changelog.md"
          cat "$RUNNER_TEMP/changelog.md"

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      # A manual run with a new tag: create it as an annotated tag by github-actions[bot] (its user id and noreply
      # address). A push with GITHUB_TOKEN does not start another run. On a re-run the tag may already be there from
      # the earlier attempt.
      - name: Create the annotated tag
        if: needs.prepare.outputs.new == 'true'
        shell: bash
        run: |
          if [ -n "$(git ls-remote origin "refs/tags/$TAG")" ]; then
            echo "$TAG already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "WeFlow $TAG" "$SHA"
          git push origin "refs/tags/$TAG"

      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist
          # Stable only when the tag is plain vX.Y.Z; anything with letters is a pre-release.
          FLAGS=()
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            FLAGS+=(--prerelease)
          fi
          # The release text comes from .github/release-notes.md; {{TAG}} and {{REPO}} are filled in, and the
          # {{CHANGELOG}} line is replaced with the changelog written above.
          sed -e "s|{{TAG}}|$TAG|g" -e "s|{{REPO}}|$GITHUB_REPOSITORY|g" .github/release-notes.md |
            awk -v f="$RUNNER_TEMP/changelog.md" '$0 == "{{CHANGELOG}}" { while ((getline l < f) > 0) print l; next } { print }' \
            > release-notes.md
          # The tag exists by now (pushed, or created above); --verify-tag keeps GitHub from making a lightweight one.
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --verify-tag \
            --notes-file release-notes.md \
            "${FLAGS[@]}"
          # the summary said "not published yet" when the run started
          echo "Published: $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url -q .url), the annotated tag $TAG at $SHA" >> "$GITHUB_STEP_SUMMARY"

  # With `bench` (#516, #601): bench.yml once the release is out, so the release never waits for it and a failed
  # benchmark leaves it as it is. It measures the base and the tag as a manual run of bench.yml does (a commit already
  # measured is not measured again), publishes the results to GitHub Pages and adds the 性能基准 section to the notes.
  bench:
    name: Benchmark
    needs: [prepare, release]
    if: needs.prepare.outputs.bench_base != ''
    permissions:
      contents: write   # the results are pushed to the gh-pages branch and the release notes edited
    uses: ./.github/workflows/bench.yml
    with:
      commits: ${{ needs.prepare.outputs.bench_base }},${{ needs.prepare.outputs.tag }}
      release_tag: ${{ needs.prepare.outputs.tag }}
