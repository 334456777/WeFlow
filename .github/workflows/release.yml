name: Release

# Push a tag such as v0.0.1 to build the `weflow` CLI for Windows, Linux and macOS, test it and publish a GitHub
# Release. The jobs run in order: build (release binaries for every target), test (the test suite, plus every
# packaged binary run once and checked against the tag), release (only after every build and test passed).
# v1.2.3 is published as a stable release; any tag with letters (v1.2.3-beta.1, v1.2.3-rc1, ...) is a pre-release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
            ext: .exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            name: windows-arm64
            ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
            ext: ""
          - os: macos-15
            target: aarch64-apple-darwin
            name: macos-arm64
            ext: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-x64
            ext: ""
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (version from rust-toolchain.toml)
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: cargo build --release -p weflow-cli --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          DIR="weflow-${TAG}-${{ matrix.name }}"
          mkdir "$DIR"
          cp "target/${{ matrix.target }}/release/weflow${{ matrix.ext }}" "$DIR/"
          cp README.md LICENSE "$DIR/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$DIR.zip" "$DIR" > /dev/null
            echo "ASSET=$DIR.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$DIR.tar.gz" "$DIR"
            echo "ASSET=$DIR.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then sha256sum "$ASSET" > "$ASSET.sha256"; else shasum -a 256 "$ASSET" > "$ASSET.sha256"; fi
          cat "$ASSET.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: weflow-${{ matrix.name }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

  test:
    name: Test ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `suite` runs `cargo test --workspace` (dev profile, as in ci.yml); Windows arm64 only runs the binary.
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
            ext: .exe
            suite: true
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            name: windows-arm64
            ext: .exe
            suite: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
            ext: ""
            suite: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
            ext: ""
            suite: true
          - os: macos-15
            target: aarch64-apple-darwin
            name: macos-arm64
            ext: ""
            suite: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-x64
            ext: ""
            suite: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: weflow-${{ matrix.name }}
          path: dist

      # build.rs takes the version from the tag and falls back to Cargo.toml, so a mismatch means the tag was
      # pushed without aligning the version first.
      - name: Run the packaged binary
        shell: bash
        working-directory: dist
        env:
          WEFLOW_HOME: ${{ runner.temp }}/weflow-home
        run: |
          DIR="weflow-${GITHUB_REF_NAME}-${{ matrix.name }}"
          if command -v sha256sum >/dev/null; then sha256sum -c ./*.sha256; else shasum -a 256 -c ./*.sha256; fi
          if [ "${{ runner.os }}" = "Windows" ]; then 7z x -y "$DIR.zip" > /dev/null; else tar -xzf "$DIR.tar.gz"; fi
          BIN="$DIR/weflow${{ matrix.ext }}"
          OUT="$("$BIN" --version)"
          echo "$OUT"
          if [[ "$OUT" != "weflow ${GITHUB_REF_NAME#v} ("* ]]; then
            echo "::error::weflow --version does not match the tag $GITHUB_REF_NAME"
            exit 1
          fi
          "$BIN" config path

      - name: Install Rust (version from rust-toolchain.toml)
        if: matrix.suite
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustc --version

      - uses: Swatinem/rust-cache@v2
        if: matrix.suite
        with:
          key: ${{ matrix.target }}-test

      - name: Check formatting
        if: matrix.name == 'linux-x64'
        shell: bash
        run: cargo fmt --all -- --check

      - name: Test suite
        if: matrix.suite
        shell: bash
        run: cargo test --workspace --target ${{ matrix.target }}

  release:
    name: Publish release
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # sign the attestation
      attestations: write   # store the attestation
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist
          # Stable only when the tag is plain vX.Y.Z; anything with letters is a pre-release.
          FLAGS=()
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            FLAGS+=(--prerelease)
          fi
          # The release text comes from .github/release-notes.md; {{TAG}} and {{REPO}} are filled in.
          sed -e "s|{{TAG}}|$GITHUB_REF_NAME|g" -e "s|{{REPO}}|$GITHUB_REPOSITORY|g" \
            .github/release-notes.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            "${FLAGS[@]}"
