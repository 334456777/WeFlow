name: Release

# Build the `weflow` CLI for Windows, Linux and macOS, test it and publish a GitHub Release. Two ways to start it:
# - push a tag such as v0.0.1;
# - run it by hand (Actions → Release → Run workflow) with a tag: an existing tag is released as is, a new one is
#   created on the latest commit of the branch picked in "Use workflow from" when the release is published.
# The jobs run in order: prepare (resolve the tag to a commit), build (release binaries for every target), test (on
# every target: the test suite, and the packaged binary run once and checked against the tag), release (only after
# every build and test passed). v1.2.3 is published as a stable release; any tag with letters (v1.2.3-beta.1,
# v1.2.3-rc1, ...) is a pre-release.
# An older commit can be released again by hand: the release text and changelog script come from the branch the
# workflow runs from, a commit from before tag-derived versions gets the tag's version stamped into Cargo.toml, and
# skip_tests leaves out the test suite that such a commit may no longer pass on the current runners. GITHUB_TOKEN
# cannot create the release on such a commit, so turn publish off and create it with `gh release create` and the
# run's artifacts (the packages and release-notes.md).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v2.1.2 (created on the selected branch if it does not exist)"
        required: true
        type: string
      notes:
        description: "Optional text shown above the generated changelog (更新日志)"
        required: false
        type: string
      skip_tests:
        description: "Only check the packaged binary; skip rustfmt, clippy and the test suite (re-releasing an older commit)"
        required: false
        type: boolean
        default: false
      publish:
        description: "Create the release; off: stop after the attestation and keep the release text as an artifact"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Resolve the tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - id: tag
        name: Resolve the tag
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag such as v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          # An existing tag keeps its commit; for an annotated tag that is the `<tag>^{}` line, not the tag object.
          REFS="$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          SHA="$(grep -F "refs/tags/$TAG^{}" <<< "$REFS" | cut -f1 || true)"
          [ -n "$SHA" ] || SHA="$(head -1 <<< "$REFS" | cut -f1)"
          if [ -n "$SHA" ]; then
            echo "Releasing the existing tag $TAG at $SHA" >> "$GITHUB_STEP_SUMMARY"
          else
            SHA="$GITHUB_SHA"
            echo "Releasing $TAG at $SHA ($GITHUB_REF_NAME); the tag is created when the release is published" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
            ext: .exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            name: windows-arm64
            ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
            ext: ""
          - os: macos-15
            target: aarch64-apple-darwin
            name: macos-arm64
            ext: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-x64
            ext: ""
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # build.rs takes the version from `git describe`; a manual run may release a tag that does not exist yet.
      - name: Tag the checkout
        shell: bash
        run: git tag -f "$TAG"

      # Commits from before tag-derived versions print Cargo.toml's version, so give it the tag's version. Marking
      # the two files unchanged keeps the build info (from `git status`) from reading "-dirty".
      - name: Stamp the version into an older commit
        shell: bash
        run: |
          if grep -q describe crates/weflow-cli/build.rs; then
            echo "build.rs takes the version from the tag"
            exit 0
          fi
          awk -v v="${TAG#v}" '/^\[/ { f = ($0 == "[workspace.package]") }
            f && /^version *=/ { print "version = \"" v "\""; next } { print }' Cargo.toml > Cargo.toml.new
          mv Cargo.toml.new Cargo.toml
          git update-index --assume-unchanged Cargo.toml Cargo.lock
          grep -A1 '^\[workspace\.package\]' Cargo.toml

      - name: Install Rust (version from rust-toolchain.toml)
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: cargo build --release -p weflow-cli --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          DIR="weflow-${TAG}-${{ matrix.name }}"
          mkdir "$DIR"
          cp "target/${{ matrix.target }}/release/weflow${{ matrix.ext }}" "$DIR/"
          cp README.md LICENSE "$DIR/"
          cp docs/zh-CN/README.md "$DIR/README.zh-CN.md"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$DIR.zip" "$DIR" > /dev/null
            echo "ASSET=$DIR.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$DIR.tar.gz" "$DIR"
            echo "ASSET=$DIR.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then sha256sum "$ASSET" > "$ASSET.sha256"; else shasum -a 256 "$ASSET" > "$ASSET.sha256"; fi
          cat "$ASSET.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: weflow-${{ matrix.name }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

  test:
    name: Test ${{ matrix.target }}
    needs: [prepare, build]
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        # Every release target, while ci.yml only tests the three main platforms.
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
            ext: .exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            name: windows-arm64
            ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
            ext: ""
          - os: macos-15
            target: aarch64-apple-darwin
            name: macos-arm64
            ext: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-x64
            ext: ""
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: weflow-${{ matrix.name }}
          path: dist

      # build.rs takes the version from the tag and falls back to Cargo.toml, so a mismatch means the release was
      # started without aligning the version first.
      - name: Run the packaged binary
        shell: bash
        working-directory: dist
        env:
          WEFLOW_HOME: ${{ runner.temp }}/weflow-home
          SKIP_TESTS: ${{ inputs.skip_tests }}
        run: |
          DIR="weflow-${TAG}-${{ matrix.name }}"
          if command -v sha256sum >/dev/null; then sha256sum -c ./*.sha256; else shasum -a 256 -c ./*.sha256; fi
          if [ "${{ runner.os }}" = "Windows" ]; then 7z x -y "$DIR.zip" > /dev/null; else tar -xzf "$DIR.tar.gz"; fi
          for f in "weflow${{ matrix.ext }}" README.md README.zh-CN.md LICENSE; do
            [ -f "$DIR/$f" ] || { echo "::error::$f is missing from the package"; exit 1; }
          done
          BIN="$DIR/weflow${{ matrix.ext }}"
          OUT="$("$BIN" --version)"
          echo "$OUT"
          if [[ "$OUT" != "weflow ${TAG#v} ("* ]]; then
            echo "::error::weflow --version does not match the tag $TAG"
            exit 1
          fi
          # The first releases had no `config path`.
          if [ "$SKIP_TESTS" = true ]; then "$BIN" --help > /dev/null; else "$BIN" config path; fi

      - name: Install Rust (version from rust-toolchain.toml)
        if: ${{ !inputs.skip_tests }}
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustc --version

      - uses: Swatinem/rust-cache@v2
        if: ${{ !inputs.skip_tests }}
        with:
          key: ${{ matrix.target }}-test

      - name: Check formatting
        if: ${{ !inputs.skip_tests && matrix.name == 'linux-x64' }}
        shell: bash
        run: cargo fmt --all -- --check

      # The same lint as `make lint` in ci.yml, on the two platforms ci.yml runs it on.
      - name: Clippy
        if: ${{ !inputs.skip_tests && (matrix.name == 'linux-x64' || matrix.name == 'macos-arm64') }}
        shell: bash
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test suite
        if: ${{ !inputs.skip_tests }}
        shell: bash
        run: cargo test --workspace --target ${{ matrix.target }}

  release:
    name: Publish release
    needs: [prepare, build, test]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      SHA: ${{ needs.prepare.outputs.sha }}
    permissions:
      contents: write
      id-token: write       # sign the attestation
      attestations: write   # store the attestation
      issues: read          # the changelog lists issues
      pull-requests: read   # and pull requests
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0    # the changelog reads the history since the previous release

      # The binaries take their version from the tag; Cargo.toml's version only shows in builds without git (the
      # "Source code" archives), so a stale one is a warning, not a reason to stop the release.
      - name: Compare Cargo.toml with the tag
        shell: bash
        run: |
          # Only stable releases (plain vX.Y.Z, the same rule as below); pre-releases are expected to differ.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$TAG is a pre-release, not compared"
            exit 0
          fi
          CARGO_VERSION="$(awk '/^\[workspace\.package\]/ { f = 1; next } /^\[/ { f = 0 }
            f && /^version *=/ { gsub(/^[^"]*"|".*$/, ""); print; exit }' Cargo.toml)"
          if [ "$CARGO_VERSION" != "${TAG#v}" ]; then
            MSG="Cargo.toml says $CARGO_VERSION but the tag is $TAG; source archives built without git will report $CARGO_VERSION"
            echo "::warning::$MSG"
            echo "> [!WARNING]" >> "$GITHUB_STEP_SUMMARY"
            echo "> $MSG" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Cargo.toml matches the tag ($CARGO_VERSION)"
          fi

      # The workflow's own commit (the tag itself when a tag push started it) has the current release text and
      # changelog script; an older commit being released again may predate them.
      - name: Take the release tooling from the workflow's commit
        shell: bash
        run: |
          git show "$GITHUB_SHA:.github/release-notes.md" > "$RUNNER_TEMP/release-notes.md"
          git show "$GITHUB_SHA:.github/scripts/release-changelog.sh" > "$RUNNER_TEMP/release-changelog.sh"

      # The 更新日志 section: the optional `notes` input, then what .github/scripts/release-changelog.sh lists
      # since the previous release (closed issues by label, pull requests without an issue, new open issues).
      - name: Write the changelog
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ inputs.notes }}
        run: |
          {
            if [ -n "$NOTES" ]; then printf '%s\n\n' "$NOTES"; fi
            bash "$RUNNER_TEMP/release-changelog.sh" "$TAG" "$SHA"
          } > "$RUNNER_TEMP/changelog.md"
          cat "$RUNNER_TEMP/changelog.md"

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      # The release text comes from .github/release-notes.md; {{TAG}} and {{REPO}} are filled in, and the
      # {{CHANGELOG}} line is replaced with the changelog written above.
      - name: Write the release text
        shell: bash
        run: |
          sed -e "s|{{TAG}}|$TAG|g" -e "s|{{REPO}}|$GITHUB_REPOSITORY|g" "$RUNNER_TEMP/release-notes.md" |
            awk -v f="$RUNNER_TEMP/changelog.md" '$0 == "{{CHANGELOG}}" { while ((getline l < f) > 0) print l; next } { print }' \
            > release-notes.md

      # GITHUB_TOKEN gets a 403 creating a release on a commit whose workflow files differ from the default branch
      # (it cannot have the workflows permission), so an older commit is published by hand with these files.
      - name: Keep the release text for publishing by hand
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

      - name: Create the release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist
          # Stable only when the tag is plain vX.Y.Z; anything with letters is a pre-release.
          FLAGS=()
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            FLAGS+=(--prerelease)
          fi
          # --target only matters for a new tag: GitHub creates it on that commit.
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --target "$SHA" \
            --notes-file release-notes.md \
            "${FLAGS[@]}"
