name: Claude

# Mentioning @claude in an issue, a pull request, a comment or a review runs Claude Code
# (anthropics/claude-code-action), which answers in the thread as claude[bot] through the Claude GitHub App
# installed on the repository. The action answers only users with write access to the repository: mentions by
# anyone else, and by bots, are skipped. It signs in to the Claude API by Workload Identity Federation, exchanging
# the job's GitHub OIDC token (id-token: write), so no API key is stored; the federation rule in the Claude Console
# decides which repository's tokens it accepts.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # the GitHub OIDC token exchanged for the Claude API and the Claude GitHub App
      id-token: write
      # lets Claude read the results of CI
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: fdrl_01MUAcbVShc6TpAHiffiLoPD
          anthropic_organization_id: 00abe4ae-1b8f-4b20-8ab2-5946465ffe93
          anthropic_service_account_id: svac_018bofy5DpvXgSb8qRUy2RjW
          anthropic_workspace_id: wrkspc_011ii9ALAWEiSCdyioVNUTkM
          # the alias follows the latest Opus; effort is the model's default
          claude_args: --model opus
