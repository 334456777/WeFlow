name: Claude

# Mentioning @claude in an issue, a pull request, a comment or a review gets an answer in the same place:
# .github/claude/answer.mjs runs Claude Code through the Claude Agent SDK, read-only, and replies as
# github-actions[bot] (see that script). Only users who can write to the repository are answered; the job doesn't
# start for anyone else, nor for bots.
#
# Claude answers with the model alias opus. The endpoint, the models behind the aliases and the effort are set without
# editing this file: every Actions variable of the repository reaches Claude Code as an environment variable of the
# same name (ANTHROPIC_BASE_URL, ANTHROPIC_DEFAULT_OPUS_MODEL, CLAUDE_CODE_EFFORT_LEVEL, …), and the API key is the
# ANTHROPIC_API_KEY secret (ANTHROPIC_AUTH_TOKEN for a Bearer token). The values in use and how to change provider
# are on the Wiki page 发布与 CI. A run by hand asks about an issue or pull request by its number and can pick sonnet.
#
# Review comments and reviews on a fork's pull request run without secrets and with a read-only token, so they are
# skipped: ask in the pull request's conversation instead.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      number:
        description: Issue or pull request number
        required: true
      prompt:
        description: Question
        required: true
      model:
        description: Model alias, resolved by the ANTHROPIC_DEFAULT_<alias>_MODEL variable
        type: choice
        options: [opus, sonnet]
        default: opus

permissions: {}

jobs:
  answer:
    if: >-
      github.event_name == 'workflow_dispatch' || (
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
          github.event.comment.author_association || github.event.review.author_association ||
          github.event.issue.author_association) &&
        contains(github.event.comment.body || github.event.review.body ||
          format('{0} {1}', github.event.issue.title, github.event.issue.body), '@claude') &&
        (github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # reactions and replies
      issues: write
      pull-requests: write
      # gh run view, gh pr checks
      actions: read
      checks: read
      statuses: read
    steps:
      # The default branch also for reviews, whose own ref is the pull request's merge commit: CLAUDE.md, the skills
      # and the script come from main. The token isn't left in .git/config, where Claude could read it.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Answer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # all the repository's variables, which answer.mjs sets for Claude Code
          CLAUDE_VARS: ${{ toJSON(vars) }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          # Fixed here rather than in variables, which can't override them: the commands Claude runs don't see the
          # API key (GitHub tokens stay, for gh), and Claude Code sends nothing but the model requests.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: 1
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: 1
          CLAUDE_CODE_DISABLE_AUTO_MEMORY: 1
        run: node .github/claude/answer.mjs
