name: WebUI

# The WebUI under web/ (React + TypeScript + Vite) is built on its own, apart from the Rust workspace: changes to it
# type-check it, run its tests and build it. The build is uploaded so a run's output can be tried with
# `weflow serve --ui-dir`; web-release.yml publishes it (#148).
on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      # Bun (the version in packageManager of web/package.json) installs the packages and runs everything: the
      # scripts, tsc, Vite and the tests (bun test, #361)
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json

      - run: bun install --frozen-lockfile

      # src/api/contract.gen.ts is generated from contract/openapi.json, which a test of weflow-cli keeps equal to
      # what the server answers with (#399): a contract changed without regenerating the types fails here
      - name: Types of the contract
        run: bun run contract --check

      # a change of the contract its clients would read wrong raises the API version (#400): compared with the
      # contract of the commit the change is based on (the pull request's base, or the push's previous commit)
      - name: Compatibility of the contract
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] \
            || ! git fetch --quiet --depth=1 origin "$BASE" \
            || ! git show "$BASE:web/contract/openapi.json" > "$RUNNER_TEMP/contract-base.json" 2>/dev/null; then
            echo "no earlier contract to compare with"
            exit 0
          fi
          bun scripts/contract-compat.ts "$RUNNER_TEMP/contract-base.json"

      # every text the page passes through t() has its English (#439)
      - name: English of the page
        run: bun run i18n --check

      - name: Type-check
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Size of the build
        run: |
          {
            echo '### WebUI build'
            echo
            echo '| File | Bytes | Gzip |'
            echo '|---|---:|---:|'
            find dist -type f | sort | while read -r f; do
              echo "| ${f#dist/} | $(wc -c < "$f") | $(gzip -9c "$f" | wc -c) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: weflow-web
          path: web/dist
          retention-days: 14
