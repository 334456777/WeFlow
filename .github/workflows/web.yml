name: WebUI

# The WebUI under web/ (React + TypeScript + Vite) is built on its own, apart from the Rust workspace: changes to it
# type-check it, run its tests and build it. The build is uploaded so a run's output can be tried with
# `weflow serve --ui-dir`; web-release.yml publishes it (#148). Beside that, the smoke test tries the build in headless
# Chrome over a `weflow serve` of the synthetic account (#789), which a change to that account runs too.
#
# Every pull request runs this workflow, so `WebUI passed`, the check of it the ruleset of main requires, always
# reports: the `changes` job reads the files the pull request changes, and the jobs run only when they include the
# paths of `on.push`. A pull request that changes none of them skips them, and `WebUI passed` passes.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "crates/weflow-cli/examples/dev_account.rs"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether a pull request changes the WebUI, by the paths of its files (a renamed file's old path too), those of
  # `on.push`. A push or a run by hand runs every job.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      web: ${{ steps.files.outputs.web }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)')
          web=false
          while read -r path; do
            case "$path" in
              web/* | crates/weflow-cli/examples/dev_account.rs | .github/workflows/web.yml) web=true ;;
            esac
          done <<< "$files"
          echo "web=$web" | tee -a "$GITHUB_OUTPUT"

  check:
    name: typecheck, test and build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      # Bun (the version in packageManager of web/package.json) installs the packages and runs everything: the
      # scripts, tsc, Vite and the tests (bun test, #361)
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json

      # the packages Bun downloads, by the lockfile (a few tens of MB)
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-packages-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: bun-packages-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # src/api/contract.gen.ts is generated from contract/openapi.json, which a test of weflow-cli keeps equal to
      # what the server answers with (#399): a contract changed without regenerating the types fails here
      - name: Types of the contract
        run: bun run contract --check

      # a change of the contract the clients of a released API would read wrong raises the API version (#400):
      # compared with the contract of the latest release of weflow (every release since v6.0.0 keeps it), so an API
      # version no release has yet may still change.
      - name: Compatibility of the contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          earlier="$RUNNER_TEMP/contract-earlier.json"
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ -z "$tag" ] || ! git fetch --quiet --depth=1 origin "refs/tags/$tag:refs/tags/$tag" \
            || ! git show "$tag:web/contract/openapi.json" > "$earlier" 2>/dev/null; then
            echo "no release with a contract to compare with"
            exit 0
          fi
          echo "compared with the contract of $tag"
          bun scripts/contract-compat.ts "$earlier"

      # every text the page passes through t() has its English (#439)
      - name: English of the page
        run: bun run i18n --check

      # every export of src/ has a JSDoc comment right above it (#915)
      - name: Comments of the exports
        run: bun run jsdoc

      - name: Type-check
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Size of the build
        run: |
          {
            echo '### WebUI build'
            echo
            echo '| File | Bytes | Gzip |'
            echo '|---|---:|---:|'
            find dist -type f | sort | while read -r f; do
              echo "| ${f#dist/} | $(wc -c < "$f") | $(gzip -9c "$f" | wc -c) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: weflow-web
          path: web/dist
          retention-days: 14

  # The build as it is released (rendered by Preact, while bun test runs React) in headless Chrome, the one the runner
  # has, over a `weflow serve --ui-dir web/dist` of the synthetic account (#789): web/smoke/checks.ts
  smoke:
    name: smoke test of the build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (version from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      # the debug build of weflow and of the account's generator, a cache of this job's own; only main saves
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-packages-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: bun-packages-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # the check job type-checks it
      - name: Build
        run: bun --bun vite build

      # builds weflow and the synthetic account first (cargo build)
      - name: Smoke test
        run: bun run smoke

      - name: Screenshots of the checks that failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-smoke-screenshots
          path: target/web-smoke/*.png
          if-no-files-found: ignore
          retention-days: 14

  # The check of this workflow the ruleset of main requires: every job above passed, or was skipped as the pull
  # request changes nothing of the WebUI. Re-running the failed jobs runs it again.
  passed:
    name: WebUI passed
    needs: [changes, check, smoke]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
