name: WebUI

# The WebUI under web/ (React + TypeScript + Vite) is built on its own, apart from the Rust workspace: changes to it
# type-check it, run its tests and build it. The build is uploaded so a run's output can be tried with
# `weflow serve --ui-dir`; web-release.yml publishes it (#148).
on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      # Bun (the version in packageManager of web/package.json) installs the packages and runs everything: the
      # scripts, tsc, Vite and the tests (bun test, #361)
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json

      - run: bun install --frozen-lockfile

      # src/api/contract.gen.ts is generated from contract/openapi.json, which a test of weflow-cli keeps equal to
      # what the server answers with (#399): a contract changed without regenerating the types fails here
      - name: Types of the contract
        run: bun run contract --check

      # a change of the contract the clients of a released API would read wrong raises the API version (#400):
      # compared with the contract of the latest release of weflow, so an API version no release has yet may still
      # change. A release from before the contract was kept (v5.0.1 and older) tells only its API version: when it is
      # the current one, the change is compared with the contract of the commit it is based on instead.
      - name: Compatibility of the contract
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          earlier="$RUNNER_TEMP/contract-earlier.json"
          now=$(jq -r .info.version contract/openapi.json)
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ -z "$tag" ] || ! git fetch --quiet --depth=1 origin "refs/tags/$tag:refs/tags/$tag"; then
            echo "no release to compare with"
            exit 0
          fi
          if git show "$tag:web/contract/openapi.json" > "$earlier" 2>/dev/null; then
            echo "compared with the contract of $tag"
            exec bun scripts/contract-compat.ts "$earlier"
          fi
          released=$(git show "$tag:crates/weflow-cli/src/serve_api.rs" \
            | sed -n 's/^pub const API_VERSION: &str = "\([0-9]*\)";$/\1/p')
          if [ "$released" != "$now" ]; then
            echo "API $now is not released yet ($tag has API ${released:-unknown}): nothing to compare with"
            exit 0
          fi
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] \
            || ! git fetch --quiet --depth=1 origin "$BASE" \
            || ! git show "$BASE:web/contract/openapi.json" > "$earlier" 2>/dev/null; then
            echo "$tag keeps no contract and the base has none: nothing to compare with"
            exit 0
          fi
          echo "$tag keeps no contract: compared with the contract of $BASE"
          bun scripts/contract-compat.ts "$earlier"

      # every text the page passes through t() has its English (#439)
      - name: English of the page
        run: bun run i18n --check

      - name: Type-check
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Size of the build
        run: |
          {
            echo '### WebUI build'
            echo
            echo '| File | Bytes | Gzip |'
            echo '|---|---:|---:|'
            find dist -type f | sort | while read -r f; do
              echo "| ${f#dist/} | $(wc -c < "$f") | $(gzip -9c "$f" | wc -c) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: weflow-web
          path: web/dist
          retention-days: 14
