name: HTML template

# The HTML export's pages (crates/weflow-core/src/export_msg/: template.html, the chat; list.html, the lists of
# sessions and contacts) are embedded in the program made small, one copy of each for each language (template.zh.html,
# template.en.html, list.zh.html, list.en.html), which build.mjs beside them writes with Bun. A push to a branch that
# changes a template or the script builds the copies and, when they differ from the branch's, commits them to that
# branch, so the program embeds what the templates say. Nothing is checked here, and ci.yml leaves the templates, the
# script and the copies out of a pull request's paths: the copies are tested by CI on main.
on:
  push:
    branches: ["**"]
    paths:
      - "crates/weflow-core/src/export_msg/template.html"
      - "crates/weflow-core/src/export_msg/list.html"
      - "crates/weflow-core/src/export_msg/build.mjs"
      - ".github/workflows/html-template.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: html-template-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and commit the template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # the Bun of the WebUI (packageManager in web/package.json)
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json

      - run: bun crates/weflow-core/src/export_msg/build.mjs

      - name: Commit the copies when they changed
        env:
          DIR: crates/weflow-core/src/export_msg
        run: |
          COPIES="$DIR/template.zh.html $DIR/template.en.html $DIR/list.zh.html $DIR/list.en.html"
          git add $COPIES
          if git diff --cached --quiet; then
            echo "The copies are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(export): build the HTML templates"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
