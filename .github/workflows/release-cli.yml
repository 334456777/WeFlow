name: Release CLI

# Push a tag such as v0.0.1 to build the `weflow` CLI for Windows, Linux and macOS and publish a GitHub Release.
# v1.2.3 is published as a stable release; any tag with letters (v1.2.3-beta.1, v1.2.3-rc1, ...) is a pre-release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
            ext: .exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            name: windows-arm64
            ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
            ext: ""
          - os: macos-15
            target: aarch64-apple-darwin
            name: macos-arm64
            ext: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-x64
            ext: ""
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (version from rust-toolchain.toml)
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The test suite assumes Unix paths in several places (it passes on Linux and macOS), so Windows only builds.
      - name: Check formatting and tests
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo test --workspace

      - name: Build
        shell: bash
        run: cargo build --release -p weflow-cli --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          DIR="weflow-${TAG}-${{ matrix.name }}"
          mkdir "$DIR"
          cp "target/${{ matrix.target }}/release/weflow${{ matrix.ext }}" "$DIR/"
          cp README.md LICENSE "$DIR/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$DIR.zip" "$DIR" > /dev/null
            echo "ASSET=$DIR.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$DIR.tar.gz" "$DIR"
            echo "ASSET=$DIR.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then sha256sum "$ASSET" > "$ASSET.sha256"; else shasum -a 256 "$ASSET" > "$ASSET.sha256"; fi
          cat "$ASSET.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: weflow-${{ matrix.name }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # sign the attestation
      attestations: write   # store the attestation
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist
          # Stable only when the tag is plain vX.Y.Z; anything with letters is a pre-release.
          FLAGS=()
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            FLAGS+=(--prerelease)
          fi
          # The release text comes from .github/release-notes.md; {{TAG}} and {{REPO}} are filled in.
          sed -e "s|{{TAG}}|$GITHUB_REF_NAME|g" -e "s|{{REPO}}|$GITHUB_REPOSITORY|g" \
            .github/release-notes.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            "${FLAGS[@]}"
