name: CI

# Code changes run `make ci` (rustfmt, clippy and rustdoc with warnings as errors, the whole test suite) on Linux and
# macOS, plus `make docs-check`. Changes to the READMEs, CLAUDE.md or the skills alone run docs-check.yml instead, and
# changes to the HTML export's templates alone run html-template.yml (on main, the copies it commits run CI). Windows
# x64 (MSVC, a release target) builds the CLI, checks the API documentation, runs the test suite and runs the CLI once,
# since some code (the allocator setup, the platform helpers) only compiles there; Windows arm64 is left to
# release.yml, so CI covers the three main platforms. The tests use the dev profile like Linux and macOS: the release
# profile (thin LTO, one codegen unit) took ~13 minutes to compile the ~20 test binaries and ~1 minute to run them.
#
# Every pull request runs this workflow, so `CI passed`, the check of it the ruleset of main requires, always reports:
# the `changes` job reads the files the pull request changes, and the jobs run only when they include the code (the
# paths of `on.push`). A pull request that changes none of it skips them, and `CI passed` passes.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "crates/**"
      # the HTML export's templates and the script that makes them small: the program embeds what html-template.yml
      # builds from them, not these files
      - "!crates/weflow-core/src/export_msg/template.html"
      - "!crates/weflow-core/src/export_msg/list.html"
      - "!crates/weflow-core/src/export_msg/moments.html"
      - "!crates/weflow-core/src/export_msg/colours.css"
      - "!crates/weflow-core/src/export_msg/build.mjs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "clippy.toml"
      - ".cargo/**"
      - "Makefile"
      # the contract the tests keep equal to the answers (#399)
      - "web/contract/**"
      # the API version the page asks for, which a test keeps equal to the server's
      - "web/package.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Whether a pull request changes the code, by the paths of its files (a renamed file's old path too): those of
  # `on.push`, but not the HTML export's templates, their colours, the script that makes them small or the copies
  # html-template.yml commits from them, which are tested on main. A push or a run by hand runs every job.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)')
          t=crates/weflow-core/src/export_msg
          code=false
          while read -r path; do
            case "$path" in
              "$t"/template*.html | "$t"/list*.html | "$t"/moments*.html | "$t"/colours.css | "$t"/build.mjs) ;;
              crates/* | Cargo.toml | Cargo.lock | rust-toolchain.toml | clippy.toml | .cargo/* | Makefile | \
                web/contract/* | web/package.json | .github/workflows/ci.yml) code=true ;;
            esac
          done <<< "$files"
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  ci:
    name: make ci (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (version from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      # Only main saves: the cache quota is 10 GB and every pull request's merge ref saved its own copy of each
      # cache, which evicted the ones main reads. A failed run saves too, so a retry after a clippy or test failure
      # does not compile everything again.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: make ci
        run: make ci

  windows:
    name: build and test (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (version from rust-toolchain.toml)
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustc --version

      # rust-cache does not save again after an exact hit, so the key changes whenever the cached profiles do;
      # `release-dev-doc` holds the dependencies of the release build, the dev-profile tests and the documentation.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-release-dev-doc
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Build
        shell: bash
        run: cargo build --release -p weflow-cli --target ${{ matrix.target }}

      # the documentation of the code only Windows compiles, as `make rustdoc` checks it on Linux and macOS
      - name: Documentation
        shell: bash
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --target ${{ matrix.target }}

      - name: Test
        shell: bash
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: Run once
        shell: bash
        env:
          WEFLOW_HOME: ${{ runner.temp }}/weflow-home
        run: |
          ./target/${{ matrix.target }}/release/weflow.exe --version
          ./target/${{ matrix.target }}/release/weflow.exe config path

  docs-check:
    name: make docs-check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (version from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      # Its own cache, which docs-check.yml's job (same job id) shares: `-p weflow-native` builds the dependencies with
      # other features than `make ci`'s `--workspace`, so the `ci` job's cache does not fit (the job took three times
      # as long on it). Only main saves.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: make docs-check
        run: make docs-check

  # The check of this workflow the ruleset of main requires: every job above passed, or was skipped as the pull
  # request changes no code. Re-running the failed jobs runs it again.
  passed:
    name: CI passed
    needs: [changes, ci, windows, docs-check]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac
