name: CI

# Code changes run `make ci` (rustfmt, clippy with warnings as errors, the whole test suite) on Linux and macOS,
# plus `make docs-check`, because the docs are checked against the code (cli-unsupported.md, the crate tables).
# Documentation-only changes run docs-check.yml instead. Windows x64 (MSVC, a release target) builds the CLI,
# runs the test suite and runs the CLI once, since some code (the allocator setup, the platform helpers) only
# compiles there; Windows arm64 is left to release.yml, so CI covers the three main platforms. The tests use the
# dev profile like Linux and macOS: the release profile (thin LTO, one codegen unit) took ~13 minutes to compile
# the ~20 test binaries and ~1 minute to run them.
on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Makefile"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Makefile"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: make ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (version from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: make ci
        run: make ci

  windows:
    name: build and test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (version from rust-toolchain.toml)
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}
          rustc --version

      # rust-cache does not save again after an exact hit, so the key changes whenever the cached profiles do;
      # `release-dev` holds the dependencies of both the release build and the dev-profile tests.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-release-dev

      - name: Build
        shell: bash
        run: cargo build --release -p weflow-cli --target ${{ matrix.target }}

      - name: Test
        shell: bash
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: Run once
        shell: bash
        env:
          WEFLOW_HOME: ${{ runner.temp }}/weflow-home
        run: |
          ./target/${{ matrix.target }}/release/weflow.exe --version
          ./target/${{ matrix.target }}/release/weflow.exe config path

  docs-check:
    name: make docs-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (version from rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: make docs-check
        run: make docs-check
